<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body><title>MapleBook Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>/* Layout: left rail on desktop, bottom tab bar on phones; one scrolling work column with a ledger-style rhythm. */
:root {
  --bg: #F3F2F1; --surface: #FFFFFF; --surface-2: #F8F7F6; --ink: #1F1B1A; --muted: #67605D; --line: #E0DBD8;
  --accent: #A62C2B; --accent-ink: #FFFFFF; --accent-soft: #F6E1DF;
  --good: #2C7A4B; --warn: #A86A12; --bad: #C0362C; --biz: #6A4AA6; --biz-soft: #ECE6F7;
  --good-soft: #E1F1E7; --warn-soft: #F7EBD7; --bad-soft: #F6E0E0;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --rail: 224px; --tabbar: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141211; --surface: #1C1918; --surface-2: #231F1E; --ink: #EFE9E7; --muted: #A69E9B; --line: #352F2D;
  --accent: #F0877D; --accent-ink: #2A0D0B; --accent-soft: #3C2220;
  --good: #6CC891; --warn: #E2AA4E; --bad: #FF8F84; --biz: #BBA3EE; --biz-soft: #2B2443;
  --good-soft: #1C3527; --warn-soft: #3A2D16; --bad-soft: #3D2020; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141211; --surface: #1C1918; --surface-2: #231F1E; --ink: #EFE9E7; --muted: #A69E9B; --line: #352F2D;
  --accent: #F0877D; --accent-ink: #2A0D0B; --accent-soft: #3C2220;
  --good: #6CC891; --warn: #E2AA4E; --bad: #FF8F84; --biz: #BBA3EE; --biz-soft: #2B2443;
  --good-soft: #1C3527; --warn-soft: #3A2D16; --bad-soft: #3D2020; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 650; }
h3 { font-size: 0.98rem; font-weight: 650; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Shell */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding: 20px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; background: var(--surface-2); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 0.9rem; }
.brand b { font-family: var(--font-display); font-size: 1.1rem; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: left; color: var(--muted); font-weight: 550; }
.nav-btn svg { width: 19px; height: 19px; flex: none; }
.nav-btn:hover { background: var(--surface); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.rail .sync { margin-top: auto; padding: 10px; font-size: 0.8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--good); } .dot.off { background: var(--warn); }

main { min-width: 0; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }

.tabbar { display: none; }
.fab { position: fixed; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(0,0,0,.18); cursor: pointer; display: grid; place-items: center; z-index: 20; }
.fab svg { width: 26px; height: 26px; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  main { padding-block: 16px calc(var(--tabbar) + 96px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .tabbar .nav-btn { flex-direction: column; gap: 2px; font-size: 0.68rem; padding: 6px 2px; align-items: center; text-align: center; }
  .tabbar .nav-btn[aria-current="page"] { background: none; }
  .fab { bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 1.35rem; }
}

/* Surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel > h2, .panel > .panel-head { margin-bottom: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 980px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 380px) { .g4 { grid-template-columns: minmax(0, 1fr); } }

.stat { display: flex; flex-direction: column; gap: 4px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.stat .val { font-family: var(--font-num); font-size: 1.35rem; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .sub { font-size: 0.8rem; color: var(--muted); }
.stat.biz { background: var(--biz-soft); border-color: transparent; }
.stat.biz .val { color: var(--biz); }
.pos { color: var(--good); } .neg { color: var(--bad); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.biz { background: var(--biz-soft); color: var(--biz); }
.chip.plain { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* Ledger rows */
.rows { display: flex; flex-direction: column; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row .k { color: var(--muted); min-width: 0; }
.row .k .line { font-family: var(--font-num); font-size: 0.72rem; color: var(--muted); opacity: .8; margin-right: 6px; }
.row .v { margin-left: auto; max-width: 100%; overflow-wrap: anywhere; font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; white-space: normal; }
.row.total { border-top: 1px solid var(--ink); border-bottom: 0; margin-top: 4px; padding-top: 9px; font-weight: 650; }
.row.total .k { color: var(--ink); }
.row.sub .k { padding-left: 14px; font-size: 0.9rem; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 0.85rem; }
.btn svg { width: 17px; height: 17px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.seg { display: inline-flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); font-size: 0.9rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 0.78rem; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=search], input[type=email], input[type=password], select, textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.money-in { position: relative; }
.money-in::before { content: "$"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-family: var(--font-num); }
.money-in input { padding-left: 24px; font-family: var(--font-num); }
.check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.toggle-row:last-child { border-bottom: 0; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }

/* Transactions */
.tx-day { font-size: 0.78rem; font-weight: 650; color: var(--muted); padding: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.06em; }
.tx { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
.tx:hover { background: var(--surface-2); }
.tx .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; flex: none; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); font-family: var(--font-display); }
.tx .ic.inc { background: var(--good-soft); color: var(--good); border-color: transparent; }
.tx .ic.bz { background: var(--biz-soft); color: var(--biz); border-color: transparent; }
.tx .mid { flex: 1; min-width: 0; }
.tx .desc { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .meta { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .amt { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters > * { flex: 1 1 150px; }
.filters input[type=search] { flex: 2 1 220px; }

/* Bars */
.bar-list { display: flex; flex-direction: column; gap: 9px; }
.bar-item { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 0.88rem; }
.bar-item .track { display: block; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar-item .fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar-item .fill.biz { background: var(--biz); }
.bar-item .fill.good { background: var(--good); }
.bar-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; min-width: 520px; height: auto; }

/* Bracket ladder */
.ladder { display: flex; flex-direction: column; gap: 6px; }
.ladder .step { display: grid; grid-template-columns: 3.6rem minmax(0, 1fr) 6.6rem; gap: 10px; align-items: center; font-size: 0.85rem; }
.ladder .step .bar { height: 22px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.ladder .step .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); border-right: 2px solid var(--accent); }
.ladder .step.current .bar { border-color: var(--accent); }
.ladder .step.current .rate { color: var(--accent); font-weight: 700; }
.ladder .rate { font-family: var(--font-num); }
.ladder .rng { font-family: var(--font-num); font-size: 0.72rem; color: var(--muted); white-space: nowrap; text-align: right; }

/* Callouts */
.callout { display: flex; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); }
.callout.biz { background: var(--biz-soft); border-color: transparent; }
.callout.good { background: var(--good-soft); border-color: transparent; }
.callout.warn { background: var(--warn-soft); border-color: transparent; }
.callout.bad { background: var(--bad-soft); border-color: transparent; }
.callout .big { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.result-hero { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }

/* Sheet (modal) */
.scrim { position: fixed; inset: 0; background: rgba(20, 12, 11, 0.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: min(640px, 100%); max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow: auto; border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); gap: 14px; }
.sheet.wide { width: min(1000px, 100%); }
@media (min-width: 821px) { .scrim { align-items: center; } .sheet { border-radius: 16px; max-height: 88vh; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.close { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; }
input.amount-big[type=text] { outline: none; font-family: var(--font-num); font-size: 2.2rem; font-weight: 600; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; padding: 4px 0 6px 26px; width: 100%; background: transparent; }
.amount-wrap { position: relative; }
.amount-wrap::before { content: "$"; position: absolute; left: 0; top: 8px; font-family: var(--font-num); font-size: 1.6rem; color: var(--muted); }
.cat-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-grid button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; font-weight: 550; }
.cat-grid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
details.more { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
details.more summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; }
details.more[open] summary { margin-bottom: 10px; }

/* Import table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 0.86rem; min-width: 640px; }
.tbl th, .tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tr.dup td { opacity: .55; }
.tbl select { padding: 5px 6px; font-size: 0.84rem; }
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 26px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; font-weight: 600; font-size: 0.9rem; max-width: calc(100% - 32px); }
@media (min-width: 821px) { .toast { bottom: 28px; } }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.month-nav { display: flex; align-items: center; gap: 6px; }
.month-nav b { font-family: var(--font-display); min-width: 9.5rem; text-align: center; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.icon-btn svg { width: 16px; height: 16px; }
.compare { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.compare th, .compare td { padding: 8px 6px; border-bottom: 1px dashed var(--line); text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.compare th { font-family: var(--font-body); font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.compare td:first-child, .compare th:first-child { text-align: left; font-family: var(--font-body); color: var(--muted); white-space: normal; }
.progress { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.auth { max-width: 420px; margin: 10vh auto; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

[hidden] { display: none !important; }
#pay-out, #exp-out, #buy-out, #scen-out { display: flex; flex-direction: column; gap: 18px; }

/* ---- v2: calendar, year views, categories, calculator ---- */
.tx-day { display: flex; justify-content: space-between; gap: 10px; }
.tx-day .num { text-transform: none; letter-spacing: 0; font-weight: 600; }
.toast { display: flex; align-items: center; gap: 14px; }
.toast-act { border: 0; background: none; color: var(--accent-soft); font-weight: 700; cursor: pointer; padding: 2px 4px; text-decoration: underline; text-underline-offset: 3px; }
:root[data-theme="dark"] .toast-act { color: var(--accent-ink); }

/* calculator */
.has-calc { position: relative; }
.money-in.has-calc input { padding-right: 40px; }
.calc-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.calc-btn:hover, .calc-btn:focus-visible { background: var(--accent-soft); color: var(--accent); }
.calc-btn svg { width: 18px; height: 18px; }
.amount-wrap .calc-btn { width: 40px; height: 40px; }
.amount-wrap .calc-btn svg { width: 22px; height: 22px; }
input.amount-big[type=text] { padding-right: 46px; }
.calc-scrim { position: fixed; inset: 0; z-index: 70; background: rgba(20, 12, 11, 0.35); display: flex; align-items: flex-end; justify-content: center; }

  const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, { acceptNode: (x) => (x.nodeType === 1 && x.matches(SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });

/* Typed amounts: in French, "12,50" means 12.50 and spaces group thousands ("1 200,50"). */
function normalizeAmountInput(v) {
  let s = String(v == null ? '' : v);
  if (!isFr()) return s;
  s = s.replace(/[\s  ]/g, '').replace(/\$/g, '');
  if (/^[−+-]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return s;            // "1,200" or "12,345.67": English-style thousands
  // "12,50", "1.234,56", "45+30,5": a comma between digits is a decimal comma
  return s.replace(/(\d)\.(?=\d{3}(?!\d))(?=[\d.]*,)/g, '$1').replace(/(\d),(\d)/g, '$1.$2');
}

ges nécessitent un compte MapleBook (courriel et mot de passe) pour que les téléphones des membres puissent partager. L'utilisation personnelle seulement n'en nécessite jamais.","Checking for your household…":"Recherche de votre ménage…","Start a household":"Créer un ménage","You'll get an invite code to share. Your MapleBook Plus covers everyone who joins.":"Vous obtiendrez un code d'invitation à partager. Votre MapleBook Plus couvre toutes les personnes qui s'y joignent.","You'll get an invite code to share. Starting a household needs MapleBook Plus (a free trial counts). It then covers everyone who joins.":"Vous obtiendrez un code d'invitation à partager. Créer un ménage nécessite MapleBook Plus (un essai gratuit compte). Il couvre ensuite toutes les personnes qui s'y joignent.","Household name":"Nom du ménage","e.g. Our home":"p. ex. Notre maison","Your name in the household":"Votre nom dans le ménage","Shown to other members":"Affiché aux autres membres","Create household":"Créer le ménage","Join a household":"Se joindre à un ménage","Ask a member for the invite code. Joining is free: the household's MapleBook Plus covers you.":"Demandez le code d'invitation à un membre. C'est gratuit : le MapleBook Plus du ménage vous couvre.","Invite code":"Code d'invitation","Join":"Se joindre","Read-only for now.":"En lecture seule pour l'instant.","Nobody in the household has MapleBook Plus at the moment, so shared items can't be added or changed. You can still look, settle up, export and leave.":"Personne dans le ménage n'a MapleBook Plus en ce moment, alors les éléments partagés ne peuvent pas être ajoutés ni modifiés. Vous pouvez encore consulter, régler les comptes, exporter et quitter.","1 change is waiting to sync.":"1 modification attend la synchronisation.","{0} changes are waiting to sync.":"{0} modifications attendent la synchronisation.","They're saved on this phone and will be sent when you're back online.":"Elles sont enregistrées sur ce téléphone et seront en ropriétaire.","You keep your personal budget. Shared transactions, bills and goals stay with the household. After you leave, you won't see the household's data, and it won't see anything of yours. You're the last member, so the household and its shared items will be deleted.":"Vous gardez votre budget personnel. Les transactions, factures et objectifs partagés restent avec le ménage. Après votre départ, vous ne verrez plus les données du ménage, et le ménage ne verra plus rien de vous. Vous êtes le dernier membre, alors le ménage et ses éléments partagés seront supprimés.","Leave household":"Quitter le ménage","Export first if you want a copy: your personal budget (backup) and the household's shared data (CSV).":"Exportez d'abord si vous voulez une copie : votre budget personnel (sauvegarde) et les données partagées du ménage (CSV).","Export my backup":"Exporter ma sauvegarde","Export shared data":"Exporter les données partagées","Stay":"Rester","Leave":"Quitter","They'll stop seeing the household right away. What they added stays.":"Cette personne cessera immédiatement de voir le ménage. Ce qu'elle a ajouté reste.","Member removed":"Membre retiré","Shared data exported":"Données partagées exportées","Invite copied":"Invitation copiée","Join our household in MapleBook. Invite code:":"Joins-toi à notre ménage dans MapleBook. Code d'invitation :","New invite code made. The old one no longer works.":"Nouveau code d'invitation créé. L'ancien ne fonctionne plus.","Household created. Invite others from Members.":"Ménage créé. Invitez d'autres personnes à partir de Membres.","You joined {0}":"Vous vous êtes joint à {0}","You left {0}. Your personal budget is unchanged.":"Vous avez quitté {0}. Votre budget personnel est inchangé.","Give the household a name":"Donnez un nom au ménage","Enter your name for the household":"Entrez votre nom pour le ménage","Enter the invite code":"Entrez le code d'invitation","Creating a household needs MapleBook Plus (a free trial counts).":"C  *
 * The app (agreement, Settings, legal viewer), the website (index, terms, privacy, delete account) and the
 * store-listing checks all read from here. Bump termsVersion and effectiveDate whenever the Terms of Use or
 * Privacy Policy change in a way users must agree to again; the app shows the agreement again on next launch.
 * Not reviewed by a lawyer yet (see docs/LAUNCH_CHECKLIST.md, "Recommended – do when revenue allows").
 */

  publisher: 'Maple Book Software',
  publisherDescription: 'Maple Book Software, a sole proprietorship registered in Ontario',
  email: 'support@maplebooksoftware.com',
  website: 'https://maplebooksoftware.com',
  appName: 'MapleBook',
  plusName: 'MapleBook Plus',
  priceMonthly: '$9.99',

  trialDays: 7,
  hostingRegion: 'Canada (Central)',
  websiteHost: 'GitHub Pages (GitHub, Inc., United States)',
  termsVersion: '2026-10-21',          // shown to users as the "last updated" date

  minimumAge: 18,

   * the app, the legal texts and the website describe that. false = the earlier device-only version. */
  cloudSync: true
};

/* Numbers the sections of a legal text. Each section is [key, title, body]; falsy entries are left out, so the
 * versions number themselves. "{§key}" in a body becomes that section's number. */
function legalSections(list) {
  const secs = list.filter(Boolean); const num = {};
  secs.forEach(([k], i) => { num[k] = i + 1; });
  return secs.map(([k, t, b], i) => `<h2>${i + 1}. ${t}</h2>\n${b.replace(/\{§(\w+)\}/g, (m, x) => num[x] || m)}`).join('\n\n');
}

    ? ['sync', 'Accounts and sync (optional)', `<p>You don't need an account to use ${A} for your own budget. An account is needed to use a household or to sync between your devices. When you create one, we collect your email address and a password (stored only in hashed form by our provider), and our provider assigns the account an ID. Your personal ${A} data described in section {§enter} is then stored with our hosting provider, Supabase, in a database located in ${L.hostingRegion}, so it can sync between your devices. Access rules on the server make sure only you can read or change your personal data, including when you are in a household. Data is encrypted in transit (HTTPS/TLS) and stored encrypted by our provider.</p>
<p>You can sign out at any time and choose whether to keep a copy on that device. You can delete your account in the app (Settings → Account and sync → Delete account, then type DELETE to confirm), which permanently deletes the account and the ${A} data stored with it and removes you from your household. You can also ask us to delete it by emailing ${L.email} from the address on the account. Instructions are on our website at ${L.website}/#delete-account.</p>`]
    : ['accounts', 'No accounts', `<p>${A} has no sign-in or user accounts, and we do not collect your name, email address or the information described in section {§enter}.</p>`],
  S && ['households', 'Households', `<p>If you create or join a household, the following is shared with its members (up to 6 people) and stored with Supabase: the household's name; each member's display name, role (owner or member) and the date they joined or left; the shared transactions, bills, savings goals and settle-up payments members add, with who added, changed or paid each one; and what each member chooses to share about their income.</p>
<p>For income, each member chooses one of: their monthly take-home pay (shown to members), "just a total" (added to the household total but never shown on its own; the total is hidden from anyone who could work out one person's figure from it, for example in a household of two; someone who notes the total before and after a member leaves or is removed can still work out that member's figure) or nothing. If the household splits costs by income, each member enters an income figure that only they can see; other members see only the resulting percentages, but a member who knows their own figure may be able to work out others' figures from those percentages.</p>
<p>Members never see each other's personal transactions, balances, settings or tax estimates. When you leave or are removed, you can no longer see the household, and its members no longer see your income choices. What you added to the household stays with it, with your display name on those items. When the last member leaves, the household and everything in it is deleted.</p>`],
  ['purchases', `${P} and payments`, `<p>${P} is sold through Google Play, which processes payments. Google provides the app with what it needs to confirm and restore your subscription (such as a purchase token, the plan and its status). We do not receive your payment card or billing details. Google's handling of your information is described in Google's privacy policy.</p>
${S ? `<p>If you are signed in, we store your subscription's status with your account (the purchase token, plan, status, trial and renewal dates, and order number) and check it with Google regularly, so your ${P} works on your devices and covers your household. Other household members see only that the household has ${P} and whose subscription provides it.</p>` : ''}
<p>Google Play gives us order and sales reports so we can handle refunds, sales taxes and support requests. These include the order number, the product, the price and, for tax purposes, the buyer's province or state, country and postal code; where Google is the merchant of record for a sale, they include only the country. They do not include your payment card details or your ${A} data.</p>
<p>If we give you free ${P} access (for example as a tester), we keep your email address and the end date of that access.</p>`],
  ['feedback', 'Feedback and beta test sign-ups (optional)', `<p><b>Feedback.</b> If you choose to send feedback from the app or our website, we collect: the kind of feedback (problem, idea, question or something confusing), your message, the screen it is about, a screenshot if you add one, the app version, the Android version (or "Web"), the language, and whether you want to see updates about it. If you are signed in, it is linked to your account. A random code is kept on your device (or in your browser) so you can see the status of your feedback and our reply without an account. To limit spam, we also keep a one-way scrambled (hashed) form of your internet (IP) address, which can't be turned back into the address. Feedback never includes your budget, transactions, amounts or account details, unless you type them into the message or show them in a screenshot, so please don't.</p>
<p><b>Beta test sign-ups.</b> If you sign up for the test on our website, we collect your email address (the Google account you use on Google Play), your first name and province if you give them, whether you have an Android phone, the language, your consent, and a scrambled form of your IP address to limit spam. We use them only to invite you to the test.</p>
<p>Both are stored with Supabase in Canada and used only to improve ${A}, answer you, and run the test. Only ${L.publisher} can read them.</p>`],
  ['auto', 'Information collected automatically', `<p>${A} does not use advertising or analytics trackers. The services the app and our website connect to, and when:</p>
<ul>
  <li><b>Android app:</b> ${S ? 'our hosting provider (Supabase, in Canada), only if you sign in or send feedback; ' : ''}Google Play, for subscriptions. Fonts and the PDF reader are built into the app, and the app blocks connections to anything else.</li>
  <li><b>Our website and web demo:</b> hosted by ${L.websiteHost}, which receives standard web server information such as your IP address. The web demo also loads typefaces from Google Fonts and the PDF reader from cdnjs (Cloudflare), which receive technical information such as your IP address. The website and demo do not use trackers, and nothing you type in the demo is saved.</li>
  <li><b>Email:</b> messages to ${L.email} are forwarded to and stored in our Google (Gmail) mailbox.</li>
</ul>`],
  ['use', 'How we use information', `<p>We use information only to provide the Service: ${S ? 'storing and syncing your data if you sign in, running households you join, ' : ''}checking and restoring subscriptions, responding to support requests and feedback, running the beta test, and keeping the Service secure. We do not use your financial information for marketing, and we do not sell, rent or trade personal information.</p>`],
  ['sharing', 'Sharing', `<p>We share information only with ${S ? 'the members of a household you join (as described above) and with ' : ''}service providers that help us run the Service (${S ? 'Supabase for accounts, sync and households; ' : ''}Google Play for subscriptions; GitHub for our website; Google for email), under agreements that require them to protect it, or where required by law. Google and GitHub may process information outside Canada (for example in the United States), where it may be subject to the laws of that jurisdiction. ${S ? 'Supabase stores your account data in Canada.' : ''}</p>`],
  ['retention', 'Retention and deletion', `<p>Data on your device stays until you delete it in the app (Settings → Your data → Delete everything) or uninstall the app.${S ? ' Account data is kept while your account exists. When you delete your account, it is deleted right away from the live database and from our provider\'s backups within 30 days. Subscription records are deleted with your account.' : ''} Support emails are kept as long as needed to respond and for our records. Feedback (with any screenshot) is kept while it helps us improve the app; it is deleted when you ask us (email us with roughly when you sent it) and when you delete your account. Beta sign-ups are deleted when the test ends or when you ask. Free-access entries are kept until we remove them from the list.</p>`],
  ['security', 'Security', `<p>We use reasonable safeguards appropriate to the sensitivity of financial information, including encryption in transit${S ? ', per-account and per-household access rules on the server,' : ''} and not storing secret keys in the app. On Android you can turn on an app lock that asks for your fingerprint, face or phone PIN; while it is on, the app's screen is hidden in the recent-apps view. Backup files you export contain your financial data; you can protect them with a password (they are then encrypted with AES-256), and if you lose that password we cannot recover the backup. No method of storage or transmission is completely secure. Protect your device with a screen lock and keep backups private.</p>`],
  ['age', 'Age', `<p>${A} is intended for people ${L.minimumAge} and older. We do not knowingly collect information from anyone under ${L.minimumAge}.</p>`],
  ['rights', 'Your rights', `<p>You can access, correct and delete your information in the app at any time${S ? ', export a backup, change what you share with a household, leave a household, sign out, and delete your account' : ' and export a backup'}. You can also contact us to request access to or correction of personal information we hold, or to make a privacy complaint. If you are not satisfied with our response, you may contact the Office of the Privacy Commissioner of Canada, or, in Quebec, the Commission d'accès à l'information.</p>`],
  ['incidents', 'Privacy incidents', `<p>If a privacy breach involving your information creates a real risk of significant harm, we will notify you and the appropriate regulators as required by law.</p>`],
  ['changes', 'Changes', `<p>We will update this policy when our practices change, update the "Last updated" date, and ask you to review material changes in the app.</p>`],
  ['language', 'Language', `<p>This policy is available in English and French. Both versions are equally authoritative.</p>`],
  ['contact', 'Contact', `<p>${contactLine(L)}</p>`]
])}`;
}

const FR_MONTH_NAMES = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function frLegalDate(iso) { const [y, m, d] = String(iso).split('-').map(Number); return `${d === 1 ? '1er' : d} ${FR_MONTH_NAMES[m - 1]} ${y}`; }
const frPrice = (p) => p.replace('$', '').replace('.', ',') + ' $';

function legalSectionsFr(list) {

}

  ['enter', 'Renseignements que vous saisissez', `<p>Pour offrir le budget et les estimations, ${A} stocke les renseignements que vous choisissez de saisir, qui peuvent comprendre vos revenus, vos dépenses, les descriptions et notes de transactions, les catégories (y compris le nom des catégories que vous créez), les soldes de comptes, les détails de votre paie, votre province ou territoire de résidence, le fait d'avoir ou non un époux ou conjoint et son revenu estimatif, des montants liés à l'impôt (comme les droits de cotisation et cotisations REER, CELIAPP et CELI), les objectifs d'épargne et leur nom, et les paramètres de l'application. Ces renseignements sont stockés sur votre appareil, dans le stockage privé de l'application${S ? ', et aussi dans votre compte si vous vous connectez (article {§sync})' : ', et ne nous sont pas transmis'}. Sur Android, ${A} est exclu des sauvegardes automatiques de Google et des transferts d'un téléphone à l'autre; vos données ne sont donc pas copiées dans un compte Google. Utilisez ${S ? 'un compte ou ' : ''}Exporter une sauvegarde pour les déplacer.</p>`],
  ['imports', 'Importation de relevés bancaires', `<p>Lorsque vous choisissez un fichier de relevé (PDF, CSV ou OFX), ${A} le lit sur votre appareil pour suggérer des transactions. Seules les transactions que vous confirmez sont enregistrées. Le fichier d'origine n'est pas conservé par ${A} et ne nous est pas transmis.</p>`],
  S
    ? ['sync', 'Comptes et synchronisation (facultatif)', `<p>Vous n'avez pas besoin d'un compte pour utiliser ${A} pour votre propre budget. Un compte est nécessaire pour utiliser un ménage ou pour synchroniser vos appareils. Lorsque vous en créez un, nous recueillons votre adresse courriel et un mot de passe (conservé seulement sous forme hachée par notre fournisseur), et notre fournisseur attribue un identifiant au compte. Vos données personnelles ${A} décrites à l'article {§enter} sont alors stockées chez notre fournisseur d'hébergement, Supabase, dans une base de données située au Canada (Centre), pour pouvoir être synchronisées entre vos appareils. Des règles d'accès sur le serveur font en sorte que vous seul pouvez lire ou modifier vos données personnelles, y compris lorsque vous faites partie d'un ménage. Les données sont chiffrées pendant leur transmission (HTTPS/TLS) et stockées chiffrées par notre fournisseur.</p>
<p>Vous pouvez vous déconnecter en tout temps et choisir de garder ou non une copie sur cet appareil. Vous pouvez supprimer votre compte dans l'application (Paramètres → Compte et synchronisation → Supprimer le compte, puis tapez SUPPRIMER pour confirmer), ce qui supprime définitivement le compte et les données ${A} qui y sont stockées et vous retire de votre ménage. Vous pouvez aussi nous demander de le supprimer en écrivant à ${L.email} à partir de l'adresse associée au compte. Les instructions se trouvent sur notre site Web à ${L.website}/fr/#delete-account.</p>`]
    : ['accounts', 'Aucun compte', `<p>${A} n'a ni connexion ni compte d'utilisateur, et nous ne recueillons pas votre nom, votre adresse courriel ni les renseignements décrits à l'article {§enter}.</p>`],
  S && ['households', 'Ménages', `<p>Si vous créez un ménage ou vous y joignez, les renseignements suivants sont partagés avec ses membres (6 personnes au maximum) et stockés chez Supabase : le nom du ménage; le nom affiché, le rôle (propriétaire ou membre) et la date d'arrivée ou de départ de chaque membre; les transactions, factures, objectifs d'épargne et remboursements partagés que les membres ajoutent, avec le nom des personnes qui les ont ajoutés, modifiés ou payés; et ce que chaque membre choisit de partager au sujet de son revenu.</p>
<p>Pour le revenu, chaque membre choisit l'une des options suivantes : sa paie nette mensuelle (montrée aux membres), « un total seulement » (ajouté au total du ménage, mais jamais montré seul; le total est masqué pour toute personne qui pourrait en déduire le montant d'un membre, par exemple dans un ménage de deux personnes; une personne qui note le total avant et après le départ ou le retrait d'un membre peut tout de même déduire le montant de ce membre) ou rien. Si le ménage partage les coûts selon le revenu, chaque membre saisit un montant de revenu que lui seul peut voir; les autres membres ne voient que les pourcentages qui en découlent, mais un membre qui connaît son propre montant pourrait en déduire celui des autres.</p>
<p>Les membres ne voient jamais les transactions, soldes, paramètres ou estimations d'impôt personnels des autres. Lorsque vous quittez un ménage ou en êtes retiré, vous ne pouvez plus le voir, et ses membres ne voient plus vos choix au sujet du revenu. Ce que vous avez ajouté au ménage y reste, avec votre nom affiché. Lorsque le dernier membre quitte le ménage, celui-ci et tout son contenu sont supprimés.</p>`],
  ['purchases', `${P} et paiements`, `<p>${P} est vendu par Google Play, qui traite les paiements. Google fournit à l'application ce dont elle a besoin pour confirmer et rétablir votre abonnement (comme un jeton d'achat, le forfait et son état). Nous ne recevons pas les détails de votre carte de paiement ni de facturation. La façon dont Google traite vos renseignements est décrite dans la politique de confidentialité de Google.</p>
${S ? `<p>Si vous êtes connecté, nous conservons l'état de votre abonnement avec votre compte (le jeton d'achat, le forfait, l'état, les dates d'essai et de renouvellement et le numéro de commande) et le vérifions régulièrement auprès de Google, pour que ${P} fonctionne sur vos appareils et couvre votre ménage. Les autres membres du ménage voient seulement que le ménage a ${P} et l'abonnement de quelle personne le fournit.</p>` : ''}
<p>Google Play nous fournit des rapports de commandes et de ventes pour nous permettre de traiter les remboursements, les taxes de vente et les demandes d'assistance. Ces rapports comprennent le numéro de commande, le produit, le prix et, aux fins fiscales, la province ou l'État, le pays et le code postal de l'acheteur; lorsque Google est le commerçant officiel d'une vente, ils comprennent seulement le pays. Ils ne comprennent pas les détails de votre carte de paiement ni vos données ${A}.</p>
<p>Si nous vous offrons un accès gratuit à ${P} (par exemple comme testeur), nous conservons votre adresse courriel et la date de fin de cet accès.</p>`],
  ['feedback', 'Commentaires et inscriptions au test bêta (facultatif)', `<p><b>Commentaires.</b> Si vous choisissez d'envoyer un commentaire à partir de l'application ou de notre site Web, nous recueillons : le genre de commentaire (problème, idée, question ou quelque chose de déroutant), votre message, l'écran visé, une capture d'écran si vous en ajoutez une, la version de l'application, la version d'Android (ou « Web »), la langue, et si vous voulez voir les mises à jour à son sujet. Si vous êtes connecté, il est lié à votre compte. Un code aléatoire est conservé sur votre appareil (ou dans votre navigateur) pour que vous puissiez voir l'état de votre commentaire et notre réponse sans compte. Pour limiter les pourriels, nous conservons aussi une forme brouillée à sens unique (hachée) de votre adresse Internet (IP), qui ne peut pas être reconvertie en adresse. Un commentaire n'inclut jamais votre budget, vos transactions, vos montants ni les détails de votre compte, à moins que vous ne les écriviez dans le message ou ne les montriez dans une capture d'écran; veuillez donc éviter de le faire.</p>
<p><b>Inscriptions au test bêta.</b> Si vous vous inscrivez au test sur notre site Web, nous recueillons votre adresse courriel (le compte Google que vous utilisez sur Google Play), votre prénom et votre province si vous les donnez, si vous avez un téléphone Android, la langue, votre consentement et une forme brouillée de votre adresse IP pour limiter les pourriels. Nous les utilisons seulement pour vous inviter au test.</p>
<p>Ces renseignements sont stockés chez Supabase, au Canada, et utilisés seulement pour améliorer ${A}, vous répondre et mener le test. Seule ${L.publisher} peut les lire.</p>`],
  ['auto', 'Renseignements recueillis automatiquement', `<p>${A} n'utilise pas de traceurs publicitaires ou analytiques. Les services auxquels l'application et notre site Web se connectent, et à quel moment :</p>
<ul>
  <li><b>Application Android :</b> ${S ? 'notre fournisseur d\'hébergement (Supabase, au Canada), seulement si vous vous connectez ou envoyez un commentaire; ' : ''}Google Play, pour les abonnements. Les polices et le lecteur PDF sont intégrés à l'application, et l'application bloque les connexions à tout autre service.</li>
  <li><b>Notre site Web et la démo Web :</b> hébergés par GitHub Pages (GitHub, Inc., États-Unis), qui reçoit les renseignements habituels d'un serveur Web, comme votre adresse IP. La démo Web charge aussi des polices de Google Fonts et le lecteur PDF de cdnjs (Cloudflare), qui reçoivent des renseignements techniques comme votre adresse IP. Le site et la démo n'utilisent pas de traceurs, et rien de ce que vous tapez dans la démo n'est enregistré.</li>
  <li><b>Courriel :</b> les messages envoyés à ${L.email} sont transférés à notre boîte Google (Gmail) et y sont conservés.</li>
</ul>`],
  ['use', 'Utilisation des renseignements', `<p>Nous utilisons les renseignements seulement pour offrir le Service : ${S ? 'stocker et synchroniser vos données si vous vous connectez, faire fonctionner les ménages dont vous faites partie, ' : ''}vérifier et rétablir les abonnements, répondre aux demandes d'assistance et aux commentaires, mener le test bêta et assurer la sécurité du Service. Nous n'utilisons pas vos renseignements financiers à des fins de marketing, et nous ne vendons, ne louons ni n'échangeons de renseignements personnels.</p>`],
  ['sharing', 'Communication', `<p>Nous communiquons des renseignements seulement ${S ? 'aux membres d\'un ménage dont vous faites partie (comme décrit ci-dessus) et ' : ''}aux fournisseurs de services qui nous aident à exploiter le Service (${S ? 'Supabase pour les comptes, la synchronisation et les ménages; ' : ''}Google Play pour les abonnements; GitHub pour notre site Web; Google pour le courriel), en vertu d'ententes qui les obligent à les protéger, ou lorsque la loi l'exige. Google et GitHub peuvent traiter des renseignements à l'extérieur du Canada (par exemple aux États-Unis), où ils peuvent être assujettis aux lois de ce territoire. ${S ? 'Supabase stocke les données des comptes au Canada.' : ''}</p>`],
  ['retention', 'Conservation et suppression', `<p>Les données sur votre appareil y restent jusqu'à ce que vous les supprimiez dans l'application (Paramètres → Vos données → Tout supprimer) ou que vous désinstalliez l'application.${S ? ' Les données d\'un compte sont conservées tant que le compte existe. Lorsque vous supprimez votre compte, elles sont supprimées immédiatement de la base de données active et des sauvegardes de notre fournisseur dans les 30 jours. Les dossiers d\'abonnement sont supprimés avec le compte.' : ''} Les courriels d'assistance sont conservés le temps nécessaire pour y répondre et pour nos dossiers. Les commentaires (avec toute capture d'écran) sont conservés tant qu'ils nous aident à améliorer l'application; ils sont supprimés lorsque vous nous le demandez (écrivez-nous en indiquant à peu près quand vous l'avez envoyé) et lorsque vous supprimez votre compte. Les inscriptions au test bêta sont supprimées à la fin du test ou à votre demande. Les accès gratuits sont conservés jusqu'à ce que nous les retirions de la liste.</p>`],
  ['security', 'Sécurité', `<p>Nous utilisons des mesures de protection raisonnables adaptées à la sensibilité des renseignements financiers, dont le chiffrement pendant la transmission${S ? ", des règles d'accès propres à chaque compte et à chaque ménage sur le serveur" : ''} et l'absence de clés secrètes dans l'application. Sur Android, vous pouvez activer un verrouillage de l'application qui demande votre empreinte digitale, votre visage ou le NIP du téléphone; lorsqu'il est activé, l'écran de l'application est masqué dans la vue des applications récentes. Les fichiers de sauvegarde que vous exportez contiennent vos données financières; vous pouvez les protéger par un mot de passe (ils sont alors chiffrés avec AES-256) et, si vous perdez ce mot de passe, nous ne pouvons pas récupérer la sauvegarde. Aucune méthode de stockage ou de transmission n'est parfaitement sûre. Protégez votre appareil par un verrouillage d'écran et gardez vos sauvegardes en lieu sûr.</p>`],
  ['age', 'Âge', `<p>${A} s'adresse aux personnes de ${L.minimumAge} ans et plus. Nous ne recueillons pas sciemment de renseignements auprès de personnes de moins de ${L.minimumAge} ans.</p>`],
  ['rights', 'Vos droits', `<p>Vous pouvez consulter, corriger et supprimer vos renseignements dans l'application en tout temps${S ? ', exporter une sauvegarde, modifier ce que vous partagez avec un ménage, quitter un ménage, vous déconnecter et supprimer votre compte' : ' et exporter une sauvegarde'}. Vous pouvez aussi nous écrire pour demander l'accès aux renseignements personnels que nous détenons ou leur rectification, ou pour déposer une plainte relative à la vie privée. Si notre réponse ne vous satisfait pas, vous pouvez vous adresser au Commissariat à la protection de la vie privée du Canada ou, au Québec, à la Commission d'accès à l'information.</p>`],
  ['incidents', 'Incidents de confidentialité', `<p>Si une atteinte à la vie privée touchant vos renseignements présente un risque réel de préjudice grave, nous vous en aviserons, ainsi que les autorités compétentes, comme l'exige la loi.</p>`],
  ['changes', 'Modifications', `<p>Nous mettrons à jour la présente politique lorsque nos pratiques changeront, mettrons à jour la date de « Dernière mise à jour » et vous demanderons de consulter les modifications importantes dans l'application.</p>`],
  ['language', 'Langue', `<p>La présente politique est offerte en français et en anglais. Les deux versions ont la même valeur.</p>`],
  ['contact', 'Coordonnées', `<p>${contactLineFr(L)}</p>`]
])}`;

/* Monthly averages used by planners */
function monthlyBaseline() {
  const proj = projection(); const sa = businessSetAsideRate(proj);
  const annualBizNet = proj.inp.business;
  const bizAfter = annualBizNet - sa.annual - proj.hstAnnual * 0 ; // HST collected is not income
  const nonTax = proj.sm.nonTaxable + proj.nonTaxFuture;
  const otherAfterTax = (proj.inp.otherTaxable) * (1 - Math.max(0, T.marginalRate(proj.inp, 'otherTaxable')));
  const netAnnual = proj.empNetAnnual + bizAfter + otherAfterTax + nonTax;
  // spending: average of last 3 complete months with data, else current month scaled
  const cur = monthOf(todayIso()); let months = []; let m = shiftMonth(cur, -1);
  for (let i = 0; i < 6 && months.length < 3; i++, m = shiftMonth(m, -1)) if ((Store.state.months[m] || []).length) months.push(m);
  let spend = 0, n = months.length;
  if (n) spend = months.reduce((s, mm) => s + summarize(txInMonth(mm)).spending, 0) / n;
  else { const c = summarize(txInMonth(cur)); const d = new Date().getDate(); spend = d > 0 ? c.spending / d * 30.4 : 0; }
  const netMonthly = netAnnual / 12;
  return { netMonthly, spendMonthly: spend, surplus: netMonthly - spend, monthsUsed: months, proj, sa };
}

const FREQ_TO_MONTH = { once: 0, weekly: 52 / 12, biweekly: 26 / 12, semimonthly: 2, monthly: 1, quarterly: 1 / 3, yearly: 1 / 12 };

/* ---------- Accounts & balances ---------- */
const ACCOUNT_TYPES = [['chequing', 'Chequing'], ['savings', 'Savings'], ['cash', 'Cash'], ['investment', 'Investments (TFSA, RRSP…)'], ['credit', 'Credit card (amount owed)']];
function accounts() { return (Store.state.settings.accounts || []); }
/* Today's balance: the number you entered, plus transactions since that date for the account you track. */
function accountBalance(a, asOf = todayIso()) {
  let bal = +a.balance || 0;
  if (a.tracked) {
    for (const t of allTx()) {
      if (t.date > (a.asOf || '0000') && t.date <= asOf) bal += (t.type === 'income' ? 1 : -1) * (+t.amount || 0) * (a.type === 'credit' ? -1 : 1);
    }
  }
  return bal;
}
function balanceSummary() {
  const list = accounts().map((a) => ({ ...a, now: accountBalance(a) }));
  const sign = (a) => (a.type === 'credit' ? -1 : 1);
  const net = list.reduce((s, a) => s + sign(a) * a.now, 0);
  const emergency = list.filter((a) => a.emergency && a.type !== 'credit').reduce((s, a) => s + a.now, 0);
  const owed = list.filter((a) => a.type === 'credit').reduce((s, a) => s + a.now, 0);
  return { list, net, emergency, owed, has: list.length > 0 };
}
function saveAccount(acc) {

/* ---------- Spending by category (monthly average) ---------- */
const ESSENTIALS = new Set(['housing', 'utilities', 'groceries', 'transport', 'fuel', 'car', 'insurance', 'phone', 'health', 'kids', 'debt']);
function avgSpendingByCat() {
  const cur = monthOf(todayIso()); const months = []; let m = shiftMonth(cur, -1);
  for (let i = 0; i < 6 && months.length < 3; i++, m = shiftMonth(m, -1)) if ((Store.state.months[m] || []).length) months.push(m);
  const by = {}; const n = months.length || 1;
  const src = months.length ? months : [cur];
  for (const mm of src) for (const t of txInMonth(mm)) if (t.type === 'expense' && !NON_SPENDING.has(t.cat)) by[t.cat] = (by[t.cat] || 0) + +t.amount / n;
  if (!months.length) { const d = new Date().getDate(); for (const k in by) by[k] = by[k] / Math.max(d, 1) * 30.4; }
  const isEssential = (cat) => (ESSENTIALS.has(cat) && !(Store.state.settings.nonEssentialCats || []).includes(cat)) || (Store.state.settings.essentialCats || []).includes(cat);
  const essential = Object.entries(by).filter(([k]) => isEssential(k)).reduce((s, [, v]) => s + v, 0);
  const total = Object.values(by).reduce((s, v) => s + v, 0);
  return { by, essential, total, months, isEssential };
}

/* ---------- Registered accounts: what applies to the tax year ---------- */
function rrspYearOf(t) { return t.rrspYear ? +t.rrspYear : +t.date.slice(0, 4); }

/* ================= MapleBook Plus (subscription) =================

   and a 7-day free trial for first-time subscribers (Google Play decides who is eligible).
   Free: basic personal budgeting (manual transactions, categories, monthly and yearly summaries, bank balances,
   savings goals, backups). MapleBook Plus: everything else, including households, and always the current tax year's rates.
   Where Plus comes from:
     - Google Play on this phone (restored from the Google account after a reinstall), checked on the server when signed in;

    const d = leadingDate(r[col.date] || '');
    if (!d) { if (r.some((c) => c)) skipped++; continue; }
    let y = d.y || opts.year || YEAR, mo = d.m, dd = d.d;
    if (d.ambiguous && dayFirst) { mo = d.b; dd = d.a; }
    if (!validYmd(y, mo, dd)) { skipped++; continue; }
    let v = null;
    if (col.amount >= 0 && r[col.amount]) v = parseMoney(r[col.amount]);
    else { const o = col.debit >= 0 ? parseMoney(r[col.debit] || '') : null, i = col.credit >= 0 ? parseMoney(r[col.credit] || '') : null; if (o) v = -Math.abs(o); else if (i) v = Math.abs(i); }
    if (v == null || !v) { if (r.slice(1).some((c) => c && MONEY_RX.test(c))) skipped++; continue; }
    if (col.type >= 0 && /^(debit|dr)$/i.test(r[col.type] || '') && v > 0) v = -v;
    const desc = col.desc.map((i) => r[i]).filter((x) => x && x !== '-').join(' · ') || 'Transaction';
    raw.push({ date: isoOf(y, mo, dd), desc, v });
  }
  // Sign convention: bank files use negative = money out. Card files vary; purchases are the majority.
  let outIsNegative = true;
  if (opts.kind === 'card' && col.amount >= 0) { const negs = raw.filter((x) => x.v < 0).length; outIsNegative = negs > raw.length / 2; }
  const rows = raw.map((x) => ({ date: x.date, desc: x.desc, amount: Math.round(Math.abs(x.v) * 100) / 100, type: (x.v < 0) === outIsNegative ? 'expense' : 'income' }));
  return { rows, skipped };
}

/* ---------- OFX / QFX / QBO (SGML or XML) ---------- */
function parseOfx(text) {
  const rows = []; let skipped = 0;
  for (const blk of String(text).split(/<STMTTRN>/i).slice(1)) {
    const g = (tag) => { const m = blk.match(new RegExp('<' + tag + '>\\s*([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
    const d = leadingDate(g('DTPOSTED')); const amt = parseMoney(g('TRNAMT'));
    if (!d || amt == null || !validYmd(d.y, d.m, d.d)) { skipped++; continue; }
    const name = g('NAME'), memo = g('MEMO');
    rows.push({ date: isoOf(d.y, d.m, d.d), desc: [name, memo && memo !== name ? memo : ''].filter(Boolean).join(' · ') || 'Transaction', amount: Math.abs(amt), type: amt < 0 ? 'expense' : 'income', fitid: g('FITID') });
  }
  return { rows, skipped };
}

/* ---------- Duplicates ----------
   Exact: same date, amount and direction as a transaction already saved (matched one-for-one, so two real
   identical purchases on the same day aren't both hidden when only one was imported before).
   Possible: same amount and merchant within 3 days (card statements post a day or two later). */
function enrichRows(rows) {
  const existing = allTx();
  const dayNum = (iso) => Math.round(new Date(iso + 'T12:00:00').getTime() / 864e5);
  const near = existing.map((t) => ({ k: `${t.date}|${(+t.amount).toFixed(2)}|${t.type}`, d: dayNum(t.date), a: (+t.amount).toFixed(2), type: t.type, mk: merchantKey(t.desc), used: false }));
  // Exact matches first, one saved transaction per imported line, so a saved transaction can't hide two lines.
  const flags = rows.map((r) => { const k = `${r.date}|${r.amount.toFixed(2)}|${r.type}`; const hit = near.find((n) => !n.used && n.k === k); if (hit) hit.used = true; return !!hit; });
  return rows.map((r, idx) => {
    const g = guessCategory(r.desc, r.type);
    const dup = flags[idx]; let maybe = false;
    if (!dup) { const dn = dayNum(r.date); const mk = merchantKey(r.desc); maybe = near.some((n) => !n.used && n.type === r.type && n.a === r.amount.toFixed(2) && Math.abs(n.d - dn) <= 3 && mk && n.mk === mk); }
    const cat = g.type === r.type && catInfo(r.type, g.cat) ? g.cat : (r.type === 'income' ? guessCategory(r.desc, 'income').cat : guessCategory(r.desc, 'expense').cat);
    return Object.assign({}, r, { cat, include: !dup && !maybe, dup, maybe });
  });
}

/* Arithmetic in number boxes: "12.50+8*2", "1,200 / 26", "(45+30)*1.13" */
function evalExpr(input) {
  const s = normalizeAmountInput(input == null ? '' : input).replace(/[$,\s]/g, '').replace(/[×x]/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  if (!s) return null;
  const toks = s.match(/\d*\.?\d+|[+\-*/()%]/g); if (!toks || toks.join('') !== s) return null;
  let i = 0;
  const peek = () => toks[i], next = () => toks[i++];
  const expr = () => { let v = term(); while (peek() === '+' || peek() === '-') { const op = next(); const r = term(); if (r == null) return null; v = op === '+' ? v + r : v - r; } return v; };
  const term = () => { let v = factor(); if (v == null) return null; while (peek() === '*' || peek() === '/') { const op = next(); const r = factor(); if (r == null) return null; v = op === '*' ? v * r : (r === 0 ? NaN : v / r); } return v; };
  const factor = () => { const t = next(); let v;
    if (t === '-') { const f = factor(); return f == null ? null : -f; }
    if (t === '+') return factor();
    if (t === '(') { v = expr(); if (next() !== ')') return null; }
    else if (t != null && /\d/.test(t)) v = parseFloat(t); else return null;
    if (peek() === '%') { next(); v = v / 100; }
    return v; };
  const v = expr(); if (i !== toks.length || v == null || !isFinite(v)) return null;
  return Math.round(v * 100) / 100;
}

const CALC_KEYS = [['C', '(', ')', '÷'], ['7', '8', '9', '×'], ['4', '5', '6', '−'], ['1', '2', '3', '+'], ['0', '.', '⌫', '%']];

    const disp = exprStr.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');

    $('#calc-use').disabled = v == null;

const SCROLLERS = '#view .cat-list, #view .tbl-wrap, #view [data-keep-scroll]';
function keepScroll() {
  const same = render._last === ui.view + '|' + (ui.planMode || '') + '|' + (ui.taxMode || '') + '|' + (ui.hhMode || '');
  return { same, y: window.scrollY, inner: [...document.querySelectorAll(SCROLLERS)].map((e) => [e.scrollTop, e.scrollLeft]) };
}
function restoreScroll(k) {
  render._last = ui.view + '|' + (ui.planMode || '') + '|' + (ui.taxMode || '') + '|' + (ui.hhMode || '');
  if (!k.same) return;
  [...document.querySelectorAll(SCROLLERS)].forEach((e, i) => { const p = k.inner[i]; if (p) { e.scrollTop = p[0]; e.scrollLeft = p[1]; } });
  if (Math.abs(window.scrollY - k.y) > 1) window.scrollTo({ top: k.y, behavior: 'instant' });
}
/* French: translate the new screen now (not a moment later), so heights are final before the scroll is put back. */
function translateNow(el) { try { if (el && typeof isFr === 'function' && isFr() && typeof trNode === 'function') trNode(el); } catch (e) {} }
function render() {
  const k = keepScroll();
  try { renderInner(); translateNow($('#view')); } finally { restoreScroll(k); }
}
function renderInner() {
  const v = $('#view'); if (!v) return;
  document.body.dataset.view = ui.view;   // lets CSS hide the + button on Settings, where it covered the Hide buttons
  if (ui.view === 'household' && !showHouseholdTab()) ui.view = 'home';
  const fn = { home: viewHome, money: viewMoney, household: viewHousehold, tax: viewTax, pay: viewPay, plan: viewPlan, settings: viewSettings }[ui.view];
  // Tax, paycheque and planner screens need a province and pay schedule first (no defaults)
  if (ui.view === 'plan' && !ui.planMode) ui.planMode = Entitlements.has('planner') ? 'expense' : 'goals';
  // Savings goals are free and don't need a province or pay schedule
  if ((['tax', 'pay'].includes(ui.view) || (ui.view === 'plan' && ui.planMode !== 'goals')) && needsSetup()) { v.innerHTML = gatedView(ui.view); $$('.nav-btn').forEach((b) => { if (b.dataset.nav === ui.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }); return; }
  const locked = lockedView(ui.view);
  if (locked) { v.innerHTML = locked; $$('.nav-btn').forEach((b) => { if (b.dataset.nav === ui.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }); fitTabbar(); labelSwitches(); return; }
  v.innerHTML = fn();
  // the first time a screen opens: a small offer of its 30-second guide (once; Settings can turn these off)
  if (typeof guideOffer === 'function') { const g = guideOffer(); if (g) { const head = v.querySelector('.page-head'); if (head) head.insertAdjacentHTML('afterend', g); else v.insertAdjacentHTML('afterbegin', g); } }
  const after = { tax: bindTax, pay: bindPay, plan: bindPlan, settings: bindSettings, money: bindMoney, household: bindHousehold }[ui.view];
  if (after) after();
  $$('.nav-btn').forEach((b) => { if (b.dataset.nav === ui.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  fitTabbar(); labelSwitches();
}

/* Locked screens (purchases): a page head plus a friendly panel, instead of the screen. */
function lockedView(view) {
  if (view === 'tax') {
    const f = ui.taxMode === 'scenario' ? 'scenarios' : 'tax'; const p = Gate.panel(f); if (!p) return '';
    return `<div class="page-head"><div><span class="eyebrow">${provName()} · ${YEAR} tax year</span><h1>Tax</h1></div><div class="btns">${taxYearSelect()}${seg('taxmode', [['ytd', 'Year to date'], ['projected', 'Projected to Dec 31'], ['scenario', 'Scenarios']], ui.taxMode)}</div></div>${p}`;
  }
  if (view === 'pay') { const p = Gate.panel('paycheque'); return p ? `<div class="page-head"><div><span class="eyebrow">Your pay</span><h1>Paycheque</h1></div>${taxYearSelect()}</div>${p}` : ''; }
  if (view === 'plan') {
    if (ui.planMode === 'goals') return '';   // savings goals: free, never locked
    const f = ui.planMode === 'registered' ? 'registered' : ui.planMode === 'compare' ? 'compare' : 'planner';
    const p = ui.planMode === 'purchase' ? (Entitlements.has('planner') ? '' : fullPaywall('planner')) : Gate.panel(f);
    return p ? `<div class="page-head"><div><span class="eyebrow">Planner</span><h1>Planner</h1></div>${planSeg()}</div>${p}` : '';
  }
  return '';
}

/* Large text: when the tab labels don't fit (big font or display size), show icons only.
   Each button keeps its aria-label, and the label stays available to screen readers. */
function fitTabbar() {
  fitTextScale();
  const bar = document.querySelector('.tabbar'); if (!bar || getComputedStyle(bar).display === 'none') return;
  bar.classList.remove('icons-only');
  const over = bar.scrollWidth > bar.clientWidth + 1 || [...bar.querySelectorAll('.nav-label')].some((s) => s.scrollWidth > s.clientWidth + 1 || s.getBoundingClientRect().right > window.innerWidth);
  bar.classList.toggle('icons-only', over);
}
/* How much bigger than normal text is drawn (Android font size / WebView textZoom). A 16px probe with line-height 1
   is exactly 16px tall at normal size, whatever the font. At 140% and up, layouts switch to one column
   (html.text-xl) so labels, numbers and buttons get the full width instead of squeezing words. */
function textScale() {
  let p = document.getElementById('tz-probe');
  if (!p) { p = document.createElement('span'); p.id = 'tz-probe'; p.setAttribute('aria-hidden', 'true'); p.textContent = 'M';
    p.style.cssText = 'position:absolute;left:-999px;top:0;visibility:hidden;font-size:16px;line-height:1;white-space:nowrap;pointer-events:none'; document.body.appendChild(p); }
  const h = p.getBoundingClientRect().height; return h > 0 ? h / 16 : 1;
}
function fitTextScale() { const z = textScale(); document.documentElement.classList.toggle('text-xl', z >= 1.4); document.documentElement.classList.toggle('text-l', z >= 1.2); return z; }
window.addEventListener('resize', () => { clearTimeout(window._fitT); window._fitT = setTimeout(fitTabbar, 100); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitTabbar());

function monthBizSetAside(sm, sa) {
  const income = Math.max(0, sm.bizNet) * (sa.taxRate || 0);
  const cpp = Math.max(0, sm.bizNet) * (sa.cppRate || 0);
  return { income, cpp, hst: sm.hstOwing, total: income + cpp + sm.hstOwing };
}

const OV_SEG = () => seg('ovmode', [['month', 'Month'], ['year', 'Year'], ['years', 'All years']], ui.ovMode || 'month');
function yearsWithData() { const ys = new Set([todayIso().slice(0, 4)]); for (const m of Object.keys(Store.state.months)) if ((Store.state.months[m] || []).length) ys.add(m.slice(0, 4)); return [...ys].sort(); }
function monthStats(m) { const s = summarize(txInMonth(m)); return { m, n: txInMonth(m).length, inc: s.income, out: s.spending, saved: s.saved, tax: s.taxPaid, net: s.cashflow, biz: s.bizNet, sm: s }; }
function miniSplit(inc, out) {
  const max = Math.max(inc, out, 1);
  return `<div class="mini-split" aria-hidden="true"><span style="width:${(inc / max * 100).toFixed(1)}%" class="mi"></span><span style="width:${(out / max * 100).toFixed(1)}%" class="mo"></span></div>`;
}

  const active = months.filter((x) => x.n);

  const nowM = todayIso().slice(0, 7);
  const sa = +y === YEAR && !needsSetup() && Gate.allowed('business') ? businessSetAsideRate() : null;
  const cards = months.map((x) => {
    const future = x.m > nowM;
    return `<button class="month-card ${x.n ? '' : 'quiet'} ${x.m === nowM ? 'current' : ''}" data-action="goto-month" data-m="${x.m}">

      <span class="mc-row"><span>Expenses</span><span class="num">${money(x.out, true)}</span></span>

  }).join('');
  const best = active.slice().sort((a, b) => b.net - a.net)[0], worst = active.slice().sort((a, b) => a.net - b.net)[0];
  const ys = summarize(yearTx(+y));
  const cats = Object.entries(ys.byExpense).filter(([k]) => !NON_SPENDING.has(k)).map(([k, v]) => [catName('expense', k), v]).sort((a, b) => b[1] - a[1]).slice(0, 6);

      <div class="btns" style="align-items:center">${OV_SEG()}<div class="month-nav"><button class="icon-btn" data-action="ov-year" data-d="-1" aria-label="Previous year">${ICON.left}</button><b style="min-width:4rem">${y}</b><button class="icon-btn" data-action="ov-year" data-d="1" aria-label="Next year">${ICON.right}</button></div></div></div>

      ${active.length ? `<div class="grid g4">

function viewYears() {

}

  return `

        ${row('Net cashflow', signed(sm.cashflow))}
        ${row('Business tax set-aside', minus(biz.total), 'sub')}

  </div>

  <section class="panel"><div class="panel-head"><h2>${YEAR} month by month</h2><span class="small muted">Money in vs spending</span></div>${yearChart()}${yearTable(sa)}</section>`;

function yearChart() {
  const months = Array.from({ length: 12 }, (_, i) => `${YEAR}-${String(i + 1).padStart(2, '0')}`);
  const data = months.map((m) => { const s = summarize(txInMonth(m)); return { m, inc: s.income, sp: s.spending }; });
  const rawMax = Math.max(0, ...data.map((d) => Math.max(d.inc, d.sp)));
  if (rawMax <= 0) return `<div class="empty"><span>No income or spending recorded in ${YEAR} yet. The chart appears once you add transactions.</span></div>`;
  const nice = (v) => { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
  const top = Math.max(4, nice(rawMax)); const div = Number.isInteger(top / 4) ? 4 : 5;
  const W = 720, H = 220, L = 52, B = 26, plotH = H - B - 10, cw = (W - L - 8) / 12;
  const y = (v) => 10 + plotH - v / top * plotH;
  let g = '';
  for (let i = 0; i <= div; i++) { const v = Math.round(top * i / div); g += `<line x1="${L}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--font-num)">$${v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : v}</text>`; }
  data.forEach((d, i) => {
    const x = L + i * cw + cw * 0.18, bw = cw * 0.3;
    if (d.inc) g += `<rect x="${x}" y="${y(d.inc)}" width="${bw}" height="${Math.max(0, 10 + plotH - y(d.inc))}" rx="2" fill="var(--good)"><title>${monthLabel(d.m, true)} in: ${money(d.inc, true)}</title></rect>`;
    if (d.sp) g += `<rect x="${x + bw + 2}" y="${y(d.sp)}" width="${bw}" height="${Math.max(0, 10 + plotH - y(d.sp))}" rx="2" fill="var(--accent)" opacity=".55"><title>${monthLabel(d.m, true)} spent: ${money(d.sp, true)}</title></rect>`;
    g += `<text x="${L + i * cw + cw / 2}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="${d.m === ui.month ? 'var(--ink)' : 'var(--muted)'}" font-weight="${d.m === ui.month ? 700 : 400}">${monthLabel(d.m, true)}</text>`;
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and spending by month for ${YEAR}">${g}</svg></div>
    <div class="btns small" style="gap:16px;margin-top:6px"><span><span class="dot" style="display:inline-block;background:var(--good)"></span> Money in</span><span><span class="dot" style="display:inline-block;background:var(--accent);opacity:.55"></span> Spending</span></div>`;
}
function yearTable(sa) {
  const rows = []; let tot = { inc: 0, sp: 0, cf: 0, bz: 0, set: 0 }; const g = needsSetup() || !Gate.allowed('business'); const setCell = (v) => (g ? '—' : money(v, true));
  for (let i = 1; i <= 12; i++) {

}

/* ================= TRANSACTIONS ================= */
function filteredTx(monthOverride) {
  const f = ui.filter; const m = monthOverride || f.month;
  let list = m === 'all' ? allTx() : txInMonth(m);
  if (f.type !== 'all') list = list.filter((t) => t.type === f.type);
  if (f.cat !== 'all') list = list.filter((t) => t.cat === f.cat);
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter((t) => (t.desc || '').toLowerCase().includes(q) || (t.note || '').toLowerCase().includes(q) || catName(t.type, t.cat).toLowerCase().includes(q)); }
  return list.sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
}
function txRow(t) {
  const isInc = t.type === 'income'; const isBiz = isBizIncome(t) || isBizExpense(t);
  const c = catName(t.type, t.cat); const ci = catInfo(t.type, t.cat) || {};
  const ic = ci.short || c.replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).map((w) => w[0]).join('').slice(0, 2) || '•';
  // Two real buttons: the row opens the edit sheet; the category chip changes the category in one tap.

  const extra = [isBiz && !isInc ? '<span>business</span>' : '', t.gross ? `<span>gross ${money(t.gross, true)}</span>` : '', t.note ? '<span translate="no">' + esc(t.note) + '</span>' : ''].filter(Boolean).join(' · ');
  return `<div class="tx" data-tx="${t.id}" data-m="${monthOf(t.date)}">

    <span class="mid"><span class="desc"${t.desc ? ' translate="no"' : ''}>${esc(t.desc || c)}</span>${t.sample ? '<span class="ex-line"><span class="chip warn ex-chip">Example</span></span>' : ''}${extra ? `<span class="meta">${extra}</span>` : ''}</span>
    <span class="amt ${isInc ? 'pos' : ''}">${isInc ? '+' : '−'}${money(+t.amount)}</span></button>
    <button type="button" class="tx-cat" data-catpick="${t.id}" data-m="${monthOf(t.date)}"><span class="sr-only">Category: </span><span${ci.custom ? ' translate="no"' : ''}>${esc(c)}</span><span aria-hidden="true"> ▾</span></button></div>`;
}
const compact = (n) => { const a = Math.abs(n); return a >= 10000 ? Math.round(a / 1000) + 'k' : a >= 1000 ? (a / 1000).toFixed(1).replace('.0', '') + 'k' : Math.round(a).toString(); };

/* One-tap category change from the Transactions list: a short sheet of category chips (most used first), a search
   box and + New category. Choosing one saves at once, with Undo. */
function catPickSheet(t) {
  const ux = { q: '', newCat: false };
  const draw = () => {
    const all = catsFor(t.type); const top = topCats(t.type, 6); const q = ux.q.trim().toLowerCase();
    let list = [...top.map((id) => all.find((c) => c.id === id)).filter(Boolean), ...all.filter((c) => !top.includes(c.id))];
    if (q) list = all.filter((c) => c.name.toLowerCase().includes(q));
    return `<div class="sheet-head"><div><span class="eyebrow">Change category</span><h2 translate="no">${esc(t.desc || catName(t.type, t.cat))}</h2></div><button class="close" data-close aria-label="Close">×</button></div>
      <input id="cp-q" type="search" placeholder="Search categories" value="${esc(ux.q)}" aria-label="Search categories" autocomplete="off">
      <div class="cat-grid" style="margin-top:10px">${list.map((c) => `<button type="button" data-pick="${c.id}" aria-pressed="${t.cat === c.id}"${c.custom ? ' translate="no"' : ''}>${esc(c.name)}</button>`).join('')}
        <button type="button" class="add-cat" data-action="cp-new" aria-expanded="${ux.newCat}">+ New category</button></div>
      ${q && !list.length ? '<p class="small muted">No category with that name. Use + New category.</p>' : ''}
      ${ux.newCat ? `<div class="new-cat" style="margin-top:10px"><input id="cp-name" type="text" maxlength="40" placeholder="Category name" aria-label="New category name"><button type="button" class="btn sm primary" data-action="cp-create">Add</button></div>` : ''}`;
  };
  const sheet = openSheet(draw()); sheet.id = 'catpick-sheet';
  const redraw = (sel) => { sheet.innerHTML = draw(); const f = sel && $(sel, sheet); if (f) { f.focus({ preventScroll: true }); try { f.setSelectionRange(f.value.length, f.value.length); } catch (e) {} } };
  const choose = (cat) => {
    const stored = (Store.state.months[monthOf(t.date)] || []).find((x) => x.id === t.id); if (!stored) return closeSheet();
    const before = Object.assign({}, stored); if (before.cat === cat) return closeSheet();
    const out = Object.assign({}, stored, { cat }); if (cat === 'business' && t.type === 'expense') out.biz = true;
    updateTx(stored, out); if (out.desc) learnCategory(out.desc, out.type, out.cat) && Store.touch('settings');
    closeSheet(); render();
    toast(`Category changed to "${catName(t.type, cat)}"`, 'Undo', () => { const now = (Store.state.months[monthOf(before.date)] || []).find((x) => x.id === before.id); if (now) updateTx(now, before); render(); });
  };
  sheet.addEventListener('input', (e) => { if (e.target.id === 'cp-q') { ux.q = e.target.value; redraw('#cp-q'); } });
  sheet.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return; if (b.hasAttribute('data-close')) return closeSheet();
    if (b.dataset.pick) return choose(b.dataset.pick);
    if (b.dataset.action === 'cp-new') { ux.newCat = !ux.newCat; redraw('#cp-name'); return; }
    if (b.dataset.action === 'cp-create') { const inp = $('#cp-name', sheet); const c = addCategory(t.type, inp ? inp.value : ''); if (!c) { toast('Give the category a name'); if (inp) inp.focus(); return; } choose(c.id); }
  });
  return sheet;
}

function calendarView(list) {
  const m = ui.filter.month; const [y, mo] = m.split('-').map(Number);
  const first = new Date(y, mo - 1, 1); const days = new Date(y, mo, 0).getDate(); const lead = first.getDay();
  const byDay = {}; for (const t of list) { const d = +t.date.slice(8, 10); (byDay[d] = byDay[d] || { inc: 0, out: 0, n: 0 }); byDay[d].n++; if (t.type === 'income') { if (t.cat !== 'transferin') byDay[d].inc += +t.amount; } else if (t.cat !== 'transfer') byDay[d].out += +t.amount; }
  const maxOut = Math.max(1, ...Object.values(byDay).map((x) => x.out));
  const today = todayIso();
  if (!ui.calDay || ui.calDay.slice(0, 7) !== m) ui.calDay = today.slice(0, 7) === m ? today : `${m}-01`;
  let cells = ''; for (let i = 0; i < lead; i++) cells += '<div class="cal-cell empty-cell" aria-hidden="true"></div>';
  for (let d = 1; d <= days; d++) {
    const iso = `${m}-${String(d).padStart(2, '0')}`; const x = byDay[d];
    const heat = x && x.out ? (0.08 + 0.42 * x.out / maxOut).toFixed(2) : 0;
    cells += `<button class="cal-cell ${iso === ui.calDay ? 'sel' : ''} ${iso === today ? 'today' : ''}" data-day="${iso}" aria-label="${fmtDate(iso, { weekday: 'long', month: 'long', day: 'numeric' })}${x ? `, ${x.n} transactions` : ''}">
      <span class="heat" style="opacity:${heat}"></span><span class="d">${d}</span>
      ${x && x.inc ? `<span class="ci pos num">+${compact(x.inc)}</span>` : ''}${x && x.out ? `<span class="co num">−${compact(x.out)}</span>` : ''}</button>`;
  }
  const sel = list.filter((t) => t.date === ui.calDay);
  const selSm = summarize(sel);
  return `<div class="cal" role="grid">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `<div class="cal-h">${d}</div>`).join('')}${cells}</div>
    <div class="cal-day">
      <div class="panel-head" style="margin:14px 0 4px"><h3>${fmtDate(ui.calDay, { weekday: 'long', month: 'long', day: 'numeric' })}</h3>
        <div class="btns" style="align-items:center">${sel.length ? `<span class="small muted num">${signed(selSm.income - selSm.spending - selSm.saved - selSm.taxPaid)}</span>` : ''}<button class="btn sm" data-action="add" data-date="${ui.calDay}">${ICON.plus}Add on this day</button></div></div>

    </div>`;
}

      </div>
      ${isEmp ? `<details class="more" ${t.gross ? 'open' : ''}><summary>Pay stub details (optional, brings estimates closer to your actual pay)</summary>
        <div class="form-grid">
          ${field('t-gross', 'Gross pay', moneyInput('t-gross', t.gross || ''))}
          ${field('t-tax', 'Income tax deducted', moneyInput('t-tax', t.tax || ''))}
          ${field('t-cpp', 'CPP (incl. CPP2)', moneyInput('t-cpp', t.cpp || ''))}
          ${field('t-ei', 'EI', moneyInput('t-ei', t.ei || ''))}
          ${field('t-oth', 'Other deductions', moneyInput('t-oth', t.otherDed || ''), 'Pension, benefits, union dues')}
        </div>
        <div class="btns" style="margin-top:10px"><button type="button" class="btn sm" data-action="fill-stub">Fill from my pay settings</button></div>
        <p class="small muted" style="margin:8px 0 0">Without these, the app estimates gross pay and withholding from the deposit.</p></details>` : ''}
      ${isBizInc && st.hstRegistered ? `<label class="check"><input id="t-hstincl" type="checkbox" ${(t.hstIncl != null ? t.hstIncl : st.bizIncomeIncludesHst) ? 'checked' : ''}><span>Amount includes ${salesRatePct()} ${salesLabel()} I collected</span></label>` : ''}
      ${isExp ? `<div class="toggle-row"><span>Business expense <span class="small muted">(deducted from business income)</span></span>${sw('t-biz', isBizExpense(t))}</div>
        <div id="biz-extra" ${isBizExpense(t) ? '' : 'hidden'} class="form-grid">
          ${field('t-bizpct', 'Business-use %', numInput('t-bizpct', t.bizPct != null && t.bizPct !== '' ? t.bizPct : 100), 'For shared costs like phone or car')}
          ${st.hstRegistered && st.hstMethod === 'regular' ? `<label class="check" style="align-self:end"><input id="t-hstpaid" type="checkbox" ${t.hstPaid !== false ? 'checked' : ''}><span>Includes ${salesLabel()} (claim input tax credit)</span></label>` : ''}
        </div>` : ''}
      ${hh ? field('t-paidby', 'Paid by', `<select id="t-paidby">${Household.activeMembers().map((m) => `<option value="${esc(m.user_id)}" ${t.paidBy === m.user_id ? 'selected' : ''} translate="no">${esc(m.user_id === Household.me ? tr('You') : m.display_name)}</option>`).join('')}</select>`) : ''}
      ${!hh && t.type === 'expense' && t.cat === 'rrsp' ? (() => { const opts = Registered.rrspYearOptions(T.data(), t.date || todayIso()); return `<div class="form-grid">
        ${opts.length > 1 ? field('t-rrspyear', 'Count toward tax year', `<select id="t-rrspyear">${opts.map((y) => `<option value="${y}" ${+(t.rrspYear || opts[1]) === y ? 'selected' : ''}>${y}</option>`).join('')}</select>`, 'Contributions in the first 60 days of a year can count toward the previous year') : ''}
        <label class="check" style="align-self:end"><input id="t-spousal" type="checkbox" ${t.spousal ? 'checked' : ''}><span>Spousal RRSP</span></label></div>`; })() : ''}
      ${field('t-note', 'Note', `<input id="t-note" type="text" value="${esc(t.note || '')}" placeholder="Optional">`)}
      <div class="sheet-actions">
        ${existing ? `<div class="btns"><button type="button" class="btn danger sm" data-action="del-ask">Delete</button><button type="button" class="btn sm" data-action="dup-tx">Duplicate</button></div>` : `<label class="check small" style="align-items:center"><input type="checkbox" id="t-another" ${ui.addAnother ? 'checked' : ''}><span>Add another after saving</span></label>`}
        <div class="btns"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn primary" data-action="save-tx">${existing ? 'Save' : 'Add'}</button></div>
      </div>`;
  };
  const sheet = openSheet(draw());
  const capture = () => {
    const g = (id) => $(id, sheet);
    t.amount = g('#t-amount').value; t.desc = g('#t-desc').value; t.date = g('#t-date').value; t.note = g('#t-note').value;
    if (g('#t-gross')) { t.gross = g('#t-gross').value; t.tax = g('#t-tax').value; t.cpp = g('#t-cpp').value; t.ei = g('#t-ei').value; t.otherDed = g('#t-oth').value; }
    if (g('#t-hstincl')) t.hstIncl = g('#t-hstincl').checked;
    if (g('#t-biz')) { t.biz = g('#t-biz').checked; t.bizPct = g('#t-bizpct').value; }
    if (g('#t-hstpaid')) t.hstPaid = g('#t-hstpaid').checked;
    if (g('#t-spousal')) t.spousal = g('#t-spousal').checked;
    if (g('#t-rrspyear')) t.rrspYear = +g('#t-rrspyear').value;
    if (g('#nc-name')) { ux.newName = g('#nc-name').value; ux.newKind = g('#nc-kind').value; }
    if (g('#t-another')) ui.addAnother = g('#t-another').checked;
    if (g('#t-paidby')) t.paidBy = g('#t-paidby').value;
  };
  const redraw = (focusSel) => { capture(); const act = document.activeElement; if (!focusSel && act && act.id && sheet.contains(act) && act.tagName === 'INPUT') focusSel = '#' + act.id; const sc = sheet.scrollTop; sheet.innerHTML = draw(); translateNow(sheet); sheet.scrollTop = sc; if (focusSel) { const el = $(focusSel, sheet); if (el) { el.focus({ preventScroll: true }); try { if (/^(text|search)$/.test(el.type)) el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } } };
  // Suggest a category as the person types the description (after a short pause), without stealing focus
  let guessTimer = null;
  sheet.addEventListener('input', (e) => {
    if (e.target.id === 't-catq') { ux.catQ = e.target.value; redraw('#t-catq'); return; }
    if (e.target.id !== 't-desc') return;
    clearTimeout(guessTimer);
    guessTimer = setTimeout(() => {
      if (!document.body.contains(sheet) || (t.cat && !t._autoCat)) return;
      capture(); const g = guessCategory(t.desc, t.type);
      if (g.type === t.type && catInfo(t.type, g.cat) && g.cat !== t.cat && !(g.cat === 'other' || g.cat === 'othertaxable')) { t.cat = g.cat; t._autoCat = true; redraw('#t-desc'); }
    }, 450);
  });
  $('#t-desc', sheet).addEventListener('change', () => { if (!t.cat || t._autoCat) { capture(); const g = guessCategory(t.desc, t.type); if (g.type === t.type && catInfo(t.type, g.cat)) { t.cat = g.cat; t._autoCat = true; redraw(); } } });
  sheet.addEventListener('change', (e) => {
    if (e.target.id === 't-biz') { $('#biz-extra', sheet).hidden = !e.target.checked; }
    if (e.target.id === 't-date' && t.cat === 'rrsp') { capture(); t.rrspYear = null; redraw(); }
    if (e.target.id === 't-desc' && (!t.cat || t._autoCat)) { capture(); const g = guessCategory(t.desc, t.type); if (g.type === t.type && catInfo(t.type, g.cat)) { t.cat = g.cat; t._autoCat = true; redraw(); } }
  });
  const save = () => {
    capture();
    const amt = num(t.amount);
    if (!(amt > 0)) { toast('Enter an amount above zero'); $('#t-amount', sheet).focus(); return; }
    if (amt > 100000000) { toast('That amount is over $100,000,000. Check for an extra digit.'); $('#t-amount', sheet).focus(); return; }
    if (!t.date) { toast('Pick a date'); return; }
    if (!t.cat) { const g = guessCategory(t.desc, t.type); t.cat = g.type === t.type && catInfo(t.type, g.cat) ? g.cat : (t.type === 'income' ? 'othertaxable' : 'other'); }
    const out = { type: t.type, cat: t.cat, date: t.date, amount: Math.round(amt * 100) / 100, desc: (t.desc || '').trim() || catName(t.type, t.cat), note: (t.note || '').trim(), created: existing ? existing.created || Date.now() : Date.now() };
    if (t.type === 'income' && t.cat === 'employment' && num(t.gross) > 0) { out.gross = num(t.gross); out.tax = num(t.tax); out.cpp = num(t.cpp); out.ei = num(t.ei); out.otherDed = num(t.otherDed); }
    if (isBizIncome(t) && t.hstIncl != null) out.hstIncl = t.hstIncl;
    if (t.type === 'expense' && (t.biz || catKind(t) === 'business' || t.cat === 'business')) { out.biz = true; out.bizPct = num(t.bizPct) || 100; if (t.hstPaid === false) out.hstPaid = false; }
    if (t.type === 'expense' && t.cat === 'rrsp') { if (t.spousal) out.spousal = true; const yo = Registered.rrspYearOptions(T.data(), out.date); if (yo.length > 1) out.rrspYear = +(t.rrspYear || yo[1]); }
    if (existing && existing.sample) out.sample = true;
    if (t.scope === 'household') {
      const id = Household.put('tx', null, { type: out.type, cat: out.cat, date: out.date, amount: out.amount, desc: out.desc, note: out.note, paidBy: t.paidBy || Household.me });
      if (!id) return;
      if (existing) removeTx(existing);
      closeSheet(); render(); toast(existing ? 'Moved to the household' : `Added ${money(out.amount)} to the household`); return;
    }
    const before = existing ? Object.assign({}, existing) : null;
    let saved; if (existing) { updateTx(existing, out); saved = out; } else saved = addTx(out);
    if (out.desc && learnCategory(out.desc, out.type, out.cat)) Store.touch('settings');
    render();
    const undo = () => { removeTx(saved); if (before) addTx(Object.assign({}, before)); render(); };
    if (!existing && ui.addAnother) {
      Object.assign(t, { amount: '', desc: '', note: '', gross: '', tax: '', cpp: '', ei: '', otherDed: '', _autoCat: false });
      sheet.innerHTML = draw(); $('#t-amount', sheet).focus(); toast(`Added ${money(out.amount)} · ready for the next one`, 'Undo', undo);
    } else { closeSheet(); toast(existing ? 'Saved' : `Added ${money(out.amount)}`, 'Undo', undo); }
  };
  sheet.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-close')) return closeSheet();
    if (b.dataset.seg === 'tscope') { capture(); t.scope = b.dataset.val; redraw(); return; }
    if (b.dataset.seg === 'ttype') { capture(); if (t.type !== b.dataset.val) { t.type = b.dataset.val; t.cat = ''; ux.newKind = ''; } redraw(); return; }
    if (b.dataset.date) { capture(); t.date = b.dataset.date; redraw(); return; }
    if (b.dataset.cat) {
      capture();
      if (ux.editCats) {
        const id = b.dataset.cat; const name = catName(t.type, id); const undo = removeCategory(t.type, id);
        if (undo) { if (t.cat === id) t.cat = ''; redraw(); toast(`${undo.moved != null ? 'Deleted' : 'Hidden'}: "${name}"${undo.moved ? ` · ${undo.moved} moved to "${catName(t.type, undo.fallback)}"` : ''}`, 'Undo', () => { undo(); if ($('#scrim')) redraw(); render(); }); }
        return;
      }
      t.cat = b.dataset.cat; t._autoCat = false; if (t.cat === 'business' && t.type === 'expense') t.biz = true; redraw(); return;
    }
    const a = b.dataset.action;
    if (a === 'cat-edit') { capture(); ux.editCats = !ux.editCats; ux.newCat = false; redraw(); return; }
    if (a === 'cat-new') { capture(); ux.newCat = !ux.newCat; redraw('#nc-name'); return; }
    if (a === 'cat-more') { capture(); ux.allCats = true; redraw('#t-catq'); return; }
    if (a === 'cat-create') {
      capture(); if (!ux.newName.trim()) { toast('Give the category a name'); $('#nc-name', sheet).focus(); return; }
      const c = addCategory(t.type, ux.newName, ux.newKind); if (!c) return;
      t.cat = c.id; ux.newCat = false; ux.newName = ''; if (c.kind === 'business' && t.type === 'expense') t.biz = true; redraw(); toast(`Added category "${c.name}"`); return;
    }
    if (a === 'fill-stub') {
      capture(); const g = estPayGross() || num(t.amount) / 0.75;
      const e2 = T.payrollEstimate(payOpts({ gross: g }));
      t.gross = g.toFixed(2); t.tax = e2.incomeTax.toFixed(2); t.cpp = (e2.cpp + e2.cpp2).toFixed(2); t.ei = e2.ei.toFixed(2); t.otherDed = (e2.preTax + e2.otherAfterTax).toFixed(2);
      if (!num(t.amount)) t.amount = e2.net.toFixed(2);
      redraw(); return;
    }
    if (a === 'del-ask') { const copy = Object.assign({}, existing); removeTx(existing); closeSheet(); render(); toast('Transaction deleted', 'Undo', () => { addTx(copy); render(); }); return; }   // one tap, with Undo
    if (a === 'del-tx') { const copy = Object.assign({}, existing); removeTx(existing); closeSheet(); render(); toast('Transaction deleted', 'Undo', () => { addTx(copy); render(); }); return; }
    if (a === 'dup-tx') { capture(); const copy = Object.assign({}, t); delete copy.id; copy.date = todayIso(); copy.created = Date.now(); closeSheet(); txSheet(null, Object.assign(copy, { _title: 'Duplicate transaction' })); return; }
    if (a === 'save-tx') save();
  });
  sheet.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') return;
    e.preventDefault();
    if (e.target.id === 'nc-name') { sheet.querySelector('[data-action="cat-create"]').click(); return; }
    save();
  });
}

/* ---------- Import sheet ---------- */
function importSheet() {
  if (!Entitlements.has('import')) return upgradeSheet();
  let state = { kind: 'bank', rows: [], file: null, msg: '' };
  const draw = () => {
    if (!state.rows.length) return `<div class="sheet-head"><h2>Import a statement</h2><button class="close" data-close aria-label="Close">×</button></div>
      <div class="field"><span class="lbl">What kind of statement?</span>${seg('kind', [['bank', 'Chequing / savings'], ['card', 'Credit card']], state.kind)}</div>
      <label class="drop" id="drop" for="imp-file">${ICON.upload}<b>Choose a PDF statement</b><span class="small muted">Or a CSV / OFX / QFX download from your bank. Nothing is saved until you review it.</span>
        <input id="imp-file" type="file" accept=".pdf,.csv,.ofx,.qfx,.qbo,.txt,application/pdf" hidden></label>
      ${state.msg ? `<div class="callout warn"><span>${state.msg}</span></div>` : ''}
      <div class="callout"><span>After import, review every transaction. Automatic reading and categorization can be wrong.</span></div>
      <p class="small muted">PDF statements from TD, RBC, CIBC, BMO, Scotiabank, Tangerine, Simplii and most credit unions work when they contain selectable text. Scanned image PDFs can't be read; download the e-statement version instead.</p>`;
    const inc = state.rows.filter((r) => r.include);
    const totIn = inc.filter((r) => r.type === 'income').reduce((s, r) => s + r.amount, 0), totOut = inc.filter((r) => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
    const learned = Store.state.settings.learned || {};
    const why = (r) => r.dup ? 'Already saved: a saved transaction has the same date, amount and direction.' : r.maybe ? 'Maybe a duplicate: same amount and merchant within 3 days of a saved one.' : '';
    const label = (r) => String(r.desc || '').trim().slice(0, 40) || 'this merchant';
    const card = (r, i) => {
      const mk = merchantKey(r.desc); const rule = mk && learned[mk] && learned[mk].type === r.type && learned[mk].cat === r.cat && !r.userCat;
      return `<li class="imp-card ${r.dup ? 'dup' : r.maybe ? 'maybe' : ''} ${r.include ? '' : 'off'}" data-type="${r.type}">
      <label class="imp-tick"><input type="checkbox" data-i="${i}" data-f="include" ${r.include ? 'checked' : ''} aria-label="Include this transaction"></label>
      <div class="imp-body">
        <div class="imp-top"><input class="imp-desc" type="text" data-i="${i}" data-f="desc" value="${esc(r.desc)}" aria-label="Description"><b class="imp-amt num ${r.type === 'income' ? 'pos' : ''}">${r.type === 'income' ? '+' : '−'}${money(r.amount)}</b></div>
        <div class="imp-row"><input class="imp-date" type="date" data-i="${i}" data-f="date" value="${r.date}" aria-label="Date">
          <div class="seg imp-dir" role="group" aria-label="Money in or out"><button type="button" data-imp-type="expense" data-i="${i}" aria-pressed="${r.type === 'expense'}">Out</button><button type="button" data-imp-type="income" data-i="${i}" aria-pressed="${r.type === 'income'}">In</button></div></div>
        <select class="imp-cat" data-i="${i}" data-f="cat" aria-label="Category">${catsFor(r.type).map((c) => `<option value="${c.id}" ${r.cat === c.id ? 'selected' : ''}${c.custom ? ' translate="no"' : ''}>${esc(c.name)}</option>`).join('')}<option value="__new">+ New category…</option></select>
        ${r.newCat ? `<div class="new-cat imp-newcat"><input id="imp-nc-${i}" type="text" maxlength="40" placeholder="Category name" aria-label="New category name"><button type="button" class="btn sm primary" data-action="imp-nc" data-i="${i}">Add</button><button type="button" class="btn sm ghost" data-action="imp-nc-cancel" data-i="${i}">Cancel</button></div>` : ''}
        ${rule ? '<span class="chip plain imp-ruled">Remembered category</span>' : ''}
        ${r.userCat && mk ? `<button type="button" class="btn ghost sm imp-remember" data-action="imp-remember" data-i="${i}" aria-pressed="${!!r.remember}">${r.remember ? '✓ Remembered for future imports: ' : 'Always use this category for '}<span translate="no">${esc(label(r))}</span></button>` : ''}
        ${why(r) ? `<p class="imp-why small">${why(r)}</p>` : ''}
      </div></li>`;
    };
    const bulkOpts = `<option value="">Choose a category</option><optgroup label="Money out">${catsFor('expense').map((c) => `<option value="expense:${c.id}"${c.custom ? ' translate="no"' : ''}>${esc(c.name)}</option>`).join('')}</optgroup><optgroup label="Money in">${catsFor('income').map((c) => `<option value="income:${c.id}"${c.custom ? ' translate="no"' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`;
    return `<div class="sheet-head"><div><h2>Review ${state.rows.length} transactions</h2><span class="small muted"><span translate="no">${esc(state.file)}</span> · <span>untick anything you don't want</span></span></div><button class="close" data-close aria-label="Close">×</button></div>
      <div class="callout warn"><span><b>Check before importing.</b> Automatic reading and categorization can be wrong. Check each amount, In or Out, and category.</span></div>
      <div class="imp-tools">
        <div class="btns"><button type="button" class="btn sm" data-action="imp-all">Select all</button><button type="button" class="btn sm" data-action="imp-none">Select none</button><button type="button" class="btn sm ghost" data-action="imp-back">Choose another file</button></div>
        <div class="imp-bulk"><label class="lbl" for="imp-bulk-cat">Set category for the ${inc.length} selected</label><div class="imp-bulk-row"><select id="imp-bulk-cat">${bulkOpts}</select><button type="button" class="btn sm" data-action="imp-bulk">Apply</button></div></div>
      </div>
      <ul class="imp-list">${state.rows.map(card).join('')}</ul>
      ${state.skipped ? `<div class="callout warn"><span>${state.skipped} line${state.skipped === 1 ? '' : 's'} in the file couldn't be read and ${state.skipped === 1 ? 'was' : 'were'} skipped. Compare the totals with your statement.</span></div>` : ''}
      <div class="small muted imp-totals"><span>${inc.length} selected</span> · <span>In <b class="num pos">${money(totIn)}</b></span> · <span>Out <b class="num">${money(totOut)}</b></span></div>
      <div class="sticky-actions imp-foot"><button type="button" class="btn primary" data-action="imp-save" ${inc.length ? '' : 'disabled'}>Import ${inc.length} transaction${inc.length === 1 ? '' : 's'}</button></div>`;
  };
  const sheet = openSheet(draw(), true);
  const redraw = (focusSel) => { const top = sheet.scrollTop; sheet.innerHTML = draw(); bindFile(); translateNow(sheet); sheet.scrollTop = top; if (focusSel) { const f = sheet.querySelector(focusSel); if (f) f.focus({ preventScroll: true }); } };
  const handle = async (file) => {
    if (!file) return;
    state.file = file.name; state.msg = 'Reading…'; state.skipped = 0; sheet.innerHTML = draw(); bindFile();
    try {
      const name = file.name.toLowerCase();
      if (file.size === 0) throw new Error('That file is empty.');
      if (file.size > 25 * 1024 * 1024) throw new Error('That file is larger than 25 MB. Download a shorter date range from online banking and try again.');
      if (/\.(xlsx?|xlsm|numbers|ods)$/.test(name)) throw new Error('Spreadsheet files (Excel, Numbers) can\'t be read directly. In your spreadsheet app or online banking, save or download the statement as CSV and import that.');
      if (/\.(jpe?g|png|heic|gif|webp)$/.test(name)) throw new Error('Photos of statements can\'t be read. Download the PDF, CSV or OFX version from online banking.');
      let res;
      if (name.endsWith('.pdf') || file.type === 'application/pdf') {
        let lines;
        try { ({ lines } = await pdfToRows(file)); }
        catch (e) {
          if (e && (e.name === 'PasswordException' || /password/i.test(e.message || ''))) throw new Error('This PDF is password-protected. Open it in your bank\'s site or a PDF viewer, save a copy without a password, then import that copy.');
          if (e && /PDF reader could not load/.test(e.message || '')) throw e;
          throw new Error('This PDF couldn\'t be read. It may be damaged or not a statement. Try downloading it again, or use the CSV download.');
        }
        const r = parseStatementLines(lines, { kind: state.kind, year: YEAR });
        if (r.scanned) throw new Error('This PDF is a scanned image, so there is no text to read. Download the e-statement or CSV version from online banking.');
        res = { rows: r.rows, skipped: 0 };
      } else {
        const text = await file.text();
        if (/\u0000/.test(text.slice(0, 2000))) throw new Error('That doesn\'t look like a text statement file. Use a PDF, CSV, OFX or QFX download.');
        res = /<OFX>|<STMTTRN>|OFXHEADER/i.test(text) ? parseOfx(text) : parseCsv(text, { kind: state.kind, year: YEAR });
        if (res.error === 'columns') throw new Error('MapleBook couldn\'t find date and amount columns in this file. Check it\'s a transaction export (CSV) from your bank, not a summary.');
      }
      let rows = res.rows;
      if (!rows.length) throw new Error('No transactions were found in this file. If it is a PDF, check it has selectable text; otherwise try the CSV download.');
      state.rows = enrichRows(rows); state.msg = ''; state.skipped = res.skipped || 0;
      if (state.kind === 'card') state.rows.forEach((r) => { if (r.type === 'income' && /payment|thank you|paiement|pymt/i.test(r.desc)) r.cat = 'transferin'; });
    } catch (err) { console.error(err); state.msg = esc(err.message || 'That file could not be read.'); state.rows = []; }
    sheet.innerHTML = draw(); bindFile();
  };
  const bindFile = () => {
    const inp = $('#imp-file', sheet); if (inp) inp.addEventListener('change', () => handle(inp.files[0]));
    const drop = $('#drop', sheet);
    if (drop) {
      drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('over'));
      drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files[0]); });
    }
  };
  bindFile();
  const setType = (r, type) => { if (r.type === type) return; r.type = type; const g = guessCategory(r.desc, r.type); r.cat = g.type === r.type && catInfo(r.type, g.cat) ? g.cat : (r.type === 'income' ? 'othertaxable' : 'other'); r.userCat = false; r.remember = false; };
  sheet.addEventListener('change', (e) => {
    const el = e.target;
    const i = el.dataset.i; if (i == null) return; const r = state.rows[+i]; const f = el.dataset.f;
    if (f === 'include') { r.include = el.checked; redraw(); }
    else if (f === 'cat') {
      if (el.value === '__new') { r.newCat = true; redraw(`#imp-nc-${i}`); return; }
      r.cat = el.value; r.userCat = true; r.remember = false;
      // same merchant, not changed by hand: follow this choice
      const k = merchantKey(r.desc); let n = 0; state.rows.forEach((o) => { if (o !== r && !o.userCat && o.type === r.type && k && merchantKey(o.desc) === k) { o.cat = r.cat; n++; } });
      redraw(); if (n) toast(`Also set ${n} similar row${n > 1 ? 's' : ''}`);
    }
    else if (f === 'date') r.date = el.value;
    else if (f === 'desc') r.desc = el.value;
  });
  sheet.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-close')) return closeSheet();
    if (b.dataset.seg === 'kind') { state.kind = b.dataset.val; sheet.innerHTML = draw(); bindFile(); return; }
    const act = b.dataset.action; const ri = b.dataset.i != null ? state.rows[+b.dataset.i] : null;
    if (b.dataset.impType && ri) { setType(ri, b.dataset.impType); redraw(); return; }
    if (act === 'imp-all' || act === 'imp-none') { state.rows.forEach((r) => { r.include = act === 'imp-all'; }); redraw(); return; }
    if (act === 'imp-bulk') {
      const v = $('#imp-bulk-cat', sheet).value; if (!v) { toast('Choose a category first'); return; }
      const [type, cat] = v.split(':'); const sel = state.rows.filter((r) => r.include);
      if (!sel.length) { toast('Select some transactions first'); return; }
      const fit = sel.filter((r) => r.type === type); fit.forEach((r) => { r.cat = cat; r.userCat = true; r.remember = false; });
      redraw(); toast(`Set ${fit.length} to "${catName(type, cat)}"${sel.length > fit.length ? (type === 'income' ? ` · ${sel.length - fit.length} money out kept theirs` : ` · ${sel.length - fit.length} money in kept theirs`) : ''}`); return;
    }
    if (act === 'imp-remember' && ri) { ri.remember = !ri.remember; redraw(); return; }
    if (act === 'imp-nc-cancel' && ri) { ri.newCat = false; redraw(); return; }
    if (act === 'imp-nc' && ri) {
      const inp = $(`#imp-nc-${b.dataset.i}`, sheet); const c = addCategory(ri.type, inp ? inp.value : '');
      if (!c) { toast('Give the category a name'); if (inp) inp.focus(); return; }
      ri.cat = c.id; ri.userCat = true; ri.newCat = false; redraw(); toast(`Added "${c.name}"`); return;
    }
    if (b.dataset.action === 'imp-back') { state.rows = []; state.msg = ''; sheet.innerHTML = draw(); bindFile(); return; }
    if (b.dataset.action === 'imp-save') {
      const list = state.rows.filter((r) => r.include).map((r) => {
        const o = { type: r.type, cat: r.cat, date: r.date, amount: r.amount, desc: r.desc, note: '', created: Date.now(), imported: true };
        if (r.cat === 'business' && r.type === 'expense') o.biz = true;
        return o;
      });
      let learned = false; for (const r of state.rows) if (r.remember && r.userCat) learned = learnCategory(r.desc, r.type, r.cat) || learned;   // only what the person chose to remember
      if (learned) Store.touch('settings');
      addMany(list); closeSheet();
      if (list.length) { ui.filter.month = monthOf(list.map((x) => x.date).sort().pop()); }
      ui.view = 'money'; render(); toast(`Imported ${list.length} transactions`);
    }
  });
}

/* ================= TAX ================= */
function ladder(title, brackets, taxable) {
  const cur = T.marginalBracket(taxable, brackets);
  let prev = 0;
  const steps = brackets.map(([top, rate], i) => {
    const from = prev; prev = top;
    const span = top === Infinity ? Math.max(from * 0.35, 50000) : top - from;
    const fill = taxable <= from ? 0 : Math.min(1, (taxable - from) / span);
    return `<div class="step ${i === cur.index ? 'current' : ''}"><span class="rate">${(rate * 100).toFixed(2).replace(/\.?0+$/, '')}%</span><span class="bar"><i style="width:${(fill * 100).toFixed(1)}%"></i></span><span class="rng">${top === Infinity ? 'over ' + money(from, true) : money(top, true)}</span></div>`;
  }).join('');
  const room = cur.to === Infinity ? null : cur.to - taxable;
  return `<div><h3 style="margin-bottom:8px">${title}</h3><div class="ladder">${steps}</div>
    <p class="small muted" style="margin:8px 0 0">${room != null ? `${money(room, true)} of taxable income left before the ${(brackets[cur.index + 1][1] * 100).toFixed(2).replace(/\.?0+$/, '')}% bracket.` : 'You are in the top bracket.'}</p></div>`;
}

function scenarioResults() {
  const s = ui.scen; const st = S();
  const base = projection();
  const scen = projection({ hourlyRate: s.hourly === '' ? undefined : num(s.hourly), hoursPerWeek: num(s.hours), extraEmployment: num(s.extraEmp),
    extraBusiness: num(s.extraBiz), extraBizExpenses: num(s.bizExp), extraRrsp: num(s.rrsp), extraCapGains: num(s.capg) });
  const after = (r) => r.inp.employment + r.inp.business + r.inp.otherTaxable + r.inp.capitalGains - r.tax.totalOwing - r.tax.cppEmployee - r.tax.eiEmployee;
  const lines = [
    ['Total income', base.tax.totalIncome, scen.tax.totalIncome],
    ['Taxable income', base.tax.taxable, scen.tax.taxable],
    [`Federal + ${provName()} tax`, base.tax.incomeTax, scen.tax.incomeTax],
    ['Self-employed CPP', base.tax.cppSelfEmployed, scen.tax.cppSelfEmployed],
    ['Total payable', base.tax.totalOwing, scen.tax.totalOwing],
    ['Withheld / paid', base.paid, scen.paid],
    ['Refund (+) / owing (−)', base.balance, scen.balance],
    ['Income after tax, CPP & EI', after(base), after(scen)]
  ];
  const dTax = scen.tax.totalOwing - base.tax.totalOwing;
  const dInc = scen.tax.totalIncome - base.tax.totalIncome + num(s.rrsp);
  const notes = [];
  if (num(s.rrsp)) { const save = T.computeTax(scen.inp).totalOwing; const noR = T.computeTax(Object.assign({}, scen.inp, { rrsp: scen.inp.rrsp - num(s.rrsp) })).totalOwing; notes.push(`In this scenario, a ${money(num(s.rrsp), true)} RRSP deduction lowers the estimated tax by about <b>${money(noR - save, true)}</b> (${pct((noR - save) / num(s.rrsp), 0)} of the amount).`); }
  if (num(s.extraBiz)) notes.push(`Of the extra ${money(num(s.extraBiz), true)} in business income, about <b>${money(num(s.extraBiz) * T.marginalRate(scen.inp, 'business'), true)}</b> is the estimated tax and CPP on it.`);
  if (num(s.bizExp)) notes.push(`${money(num(s.bizExp), true)} of business expenses has an estimated after-tax cost of about <b>${money(num(s.bizExp) * (1 - T.marginalRate(scen.inp, 'business')), true)}</b> after the tax it saves.`);
  const scenBr = T.marginalBracket(scen.tax.taxable, T.TAX2026.fed.brackets), baseBr = T.marginalBracket(base.tax.taxable, T.TAX2026.fed.brackets);
  if (scenBr.index !== baseBr.index) notes.push(`This moves you into the ${pct(scenBr.rate, 1)} federal bracket.`);
  return `<section class="panel"><h2>Baseline vs. scenario</h2><div class="chart-wrap"><table class="compare" style="min-width:480px"><thead><tr><th></th><th>Baseline</th><th>Scenario</th><th>Change</th></tr></thead><tbody>
    ${lines.map(([k, a, b]) => `<tr><td>${k}</td><td>${money(a, true)}</td><td>${money(b, true)}</td><td class="${Math.abs(b - a) < 1 ? '' : (k.startsWith('Federal') || k.startsWith('Total payable') || k.startsWith('Self') ? (b > a ? 'neg' : 'pos') : (b > a ? 'pos' : 'neg'))}">${Math.abs(b - a) < 1 ? '—' : signed(b - a, true)}</td></tr>`).join('')}
    <tr><td>Marginal tax rate</td><td>${pct(T.marginalTaxRate(base.inp))}</td><td>${pct(T.marginalTaxRate(scen.inp))}</td><td></td></tr>
  </tbody></table></div>
  ${notes.length ? `<div class="grid" style="gap:8px;margin-top:12px">${notes.map((n) => `<div class="callout"><span>${n}</span></div>`).join('')}</div>` : ''}
  ${Math.abs(dInc) > 1 && !num(s.rrsp) ? `<p class="small muted">In this scenario, an estimated ${pct(1 - dTax / dInc, 0)} of each extra dollar remains after tax.</p>` : ''}</section>`;
}

function payResults() {

      </div>
      <div class="callout biz" style="margin-top:12px"><span>Your employer's withholding doesn't include your projected ${money(proj.inp.business, true)} business profit. The estimated tax and CPP on that profit works out to about <b>${money(perPayBiz)}</b> per pay. For reference, about <b>${money(Math.ceil(sa.taxPart / periods))}</b> of that is income tax, the part an employer can deduct through line 2 of the TD1 form ("additional tax to be deducted"). Whether and how to cover it is a choice to discuss with a tax professional. ${ESTIMATE_NOTE}</span></div></section>`
      : `<section class="panel"><h2>With your business income</h2><p class="muted">No business income is recorded or expected for ${YEAR}, so there's nothing extra to set aside. Add business income in Transactions, or an expected monthly amount in Settings.</p></section>`;
  }
  const maxNote = (e.cpp < plain.cpp - 0.01 || e.ei < plain.ei - 0.01) ? `<p class="small muted">CPP or EI is reduced because you've hit (or are about to hit) the ${YEAR} maximum.</p>` : '';
  const anchor = st.lastPayDate || lastRecordedPayDate() || todayIso();
  const remaining = T.payDatesBetween(st.payFrequency, anchor, todayIso(), `${YEAR}-12-31`);
  const cppA = T.employeeCpp(gross * periods, undefined, S().province).total, eiA = T.employeeEi(gross * periods, undefined, S().province) + T.employeeQpip(gross * periods, undefined, S().province);
  const annualTake = gross * periods - (plain.incomeTax + plain.preTax + plain.otherAfterTax) * periods - cppA - eiA;
  return `<div class="grid g2">

function baselinePanel(b) {

function verdict(after, net) {
  const st = S(); const cushion = (+st.cushionPct || 10) / 100 * net;
  if (after >= cushion) return ['good', 'Comfortable', `You'd still have ${money(after, true)} a month spare, above your ${st.cushionPct || 10}% cushion.`];
  if (after >= 0) return ['warn', 'Tight', `It fits, but leaves only ${money(after, true)} a month spare, under your ${st.cushionPct || 10}% cushion of ${money(cushion, true)}.`];
  return ['bad', 'Not affordable yet', `You'd be short ${money(-after, true)} a month. Something else would need to give.`];
}
function expenseResults() {
  const x = ui.exp; const amt = num(x.amount); const b = monthlyBaseline();
  const top = baselinePanel(b);
  if (!(amt > 0)) return `${top}<section class="panel"><div class="empty"><b>Enter an amount</b><span>You'll see your new monthly cashflow, the share of take-home pay it takes, and whether it fits.</span></div></section>`;
  let realCost = amt, taxSave = 0, itc = 0;
  if (x.biz) {
    const st = S(); const portion = amt * Math.min(100, num(x.bizPct) || 100) / 100;
    if (st.hstRegistered && st.hstMethod === 'regular') itc = portion * T.sales().rate / (1 + T.sales().rate);
    const sa = businessSetAsideRate(b.proj); const rate = b.proj.inp.business > 0 ? T.marginalRate(b.proj.inp, 'business') : 0;
    taxSave = (portion - itc) * rate; realCost = amt - taxSave - itc;
  }
  if (x.freq === 'once') {
    const months = b.surplus > 0 ? realCost / b.surplus : Infinity;
    const [cls, lab, why] = months <= 1 ? ['good', 'Covered this month', `One month of your surplus covers it, with ${money(b.surplus - realCost, true)} to spare.`] : months <= 6 ? ['warn', `About ${Math.ceil(months)} months of surplus`, `Takes ${Math.ceil(months)} months of what you normally have left over.`] : ['bad', isFinite(months) ? `${Math.ceil(months)} months of surplus` : 'No surplus to cover it', isFinite(months) ? 'Plan for it over time — see Big purchase.' : 'You currently spend everything you take home.'];
    return `${top}<section class="panel"><div class="result-hero"><div><span class="eyebrow">${esc(x.name || 'One-time cost')}</span><div class="callout ${cls}" style="margin-top:6px"><div><span class="chip ${cls}">${lab}</span><p style="margin:8px 0 0">${why}</p></div></div></div></div>
      <div class="rows" style="margin-top:12px">${row('Cost', money(amt))}${taxSave || itc ? row(`Tax saved + ${salesLabel()} credit`, minus(taxSave + itc), 'sub') + row('Real cost', money(realCost), 'total') : ''}
      ${row('Share of one month\'s take-home', pct(realCost / b.netMonthly, 0))}</div></section>`;
  }
  const monthly = amt * FREQ_TO_MONTH[x.freq]; const realMonthly = realCost * FREQ_TO_MONTH[x.freq];
  const after = b.surplus - realMonthly;
  const [cls, lab, why] = verdict(after, b.netMonthly);
  const share = realMonthly / b.netMonthly;
  const W = 420, H = 64; const scale = Math.max(b.netMonthly, b.spendMonthly + realMonthly, 1);
  const w = (v) => Math.max(0, v / scale * (W - 2));
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Take-home pay split into current spending, new expense and what is left">
    <rect x="1" y="8" width="${W - 2}" height="22" rx="4" fill="var(--surface-2)" stroke="var(--line)"/>
    <rect x="1" y="8" width="${w(Math.min(b.spendMonthly, scale))}" height="22" rx="4" fill="var(--accent)" opacity=".45"/>
    <rect x="${1 + w(b.spendMonthly)}" y="8" width="${w(realMonthly)}" height="22" fill="var(--${cls})"/>
    <line x1="${1 + w(b.netMonthly)}" x2="${1 + w(b.netMonthly)}" y1="2" y2="36" stroke="var(--ink)" stroke-width="2"/>
    <text x="${Math.min(W - 4, 1 + w(b.netMonthly))}" y="52" text-anchor="end" font-size="11" fill="var(--ink)" font-family="var(--font-num)">take-home ${money(b.netMonthly, true)}</text>
    <text x="2" y="52" font-size="11" fill="var(--muted)">current spending</text></svg>`;
  return `${top}<section class="panel"><div class="result-hero"><div><span class="eyebrow">${esc(x.name || 'New expense')}</span><h2 style="margin-top:4px">${money(realMonthly)} a month</h2></div><span class="chip ${cls}" style="font-size:.9rem">${lab}</span></div>
    <p>${why}</p><div class="chart-wrap">${svg.replace('<svg', '<svg style="min-width:0"')}</div>
    <div class="rows">
      ${x.freq !== 'monthly' ? row(`${money(amt)} ${x.freq} works out to`, money(monthly) + '/mo') : ''}
      ${taxSave || itc ? row(`Less tax saved and ${salesLabel()} credit`, minus(monthly - realMonthly) + '/mo', 'sub') : ''}
      ${row('Share of take-home pay', pct(share, 1))}
      ${row('Left over now', signed(b.surplus, true))}
      ${row('Left over after', `<span class="${after >= 0 ? 'pos' : 'neg'}">${signed(after, true)}</span>`, 'total')}
      ${row('Over a year', money(realMonthly * 12, true))}
    </div></section>`;
}

function goalRow(g, i) {

function monthsBetween(a, b) { const d1 = new Date(a + 'T12:00:00'), d2 = new Date(b + 'T12:00:00'); return (d2 - d1) / (864e5 * 30.437); }
function purchaseResults() {
  const x = ui.buy; const price = num(x.price) * (x.addHst ? 1 + T.prov().consumer.rate : 1); const saved = num(x.saved); const st = S();
  const yearOk = true;   // Plus includes every tax year

/* Restore. Merge adds what's missing (transactions, goals, categories and accounts are de-duplicated by id).

function backupStats(st) {
  const months = st.months || {}; let tx = 0; for (const m of Object.keys(months)) tx += (months[m] || []).length;
  return { tx, goals: ((st.goals || {}).items || []).length, accounts: ((st.settings || {}).accounts || []).length };

function parseBackup(text) {
  let obj; try { obj = JSON.parse(text); } catch (e) { return { error: "That file isn't a valid backup (it couldn't be read as a backup file)." }; }

  if (!s || typeof s !== 'object' || !s.months || typeof s.months !== 'object') return { error: "That file isn't a MapleBook backup." };
  for (const m of Object.keys(s.months)) if (!Array.isArray(s.months[m])) return { error: 'The backup is damaged (a month of transactions is unreadable). Nothing was changed.' };
  if (obj.counts && typeof obj.counts.tx === 'number' && backupStats(s).tx !== obj.counts.tx) return { error: `This backup looks incomplete: it should hold ${obj.counts.tx} transactions but ${backupStats(s).tx} were found. Nothing was changed.` };

const byId = (list) => { const m = new Map(); for (const x of list || []) if (x && x.id != null) m.set(String(x.id), x); return m; };
function mergeById(current, incoming) { const have = byId(current); const out = (current || []).slice(); let added = 0; for (const x of incoming || []) { if (x && x.id != null && have.has(String(x.id))) continue; out.push(x); added++; } return { list: out, added }; }
function restoreBackup(s, mode) {
  const keepAgreement = Store.state.settings.agreement;
  let addedTx = 0, addedGoals = 0;
  if (mode === 'replace') {
    for (const m of Object.keys(Store.state.months)) { Store.state.months[m] = []; Store.touch('tx-' + m); }
    const incomingSettings = Object.assign({}, s.settings || {}); delete incomingSettings.agreement;
    Store.state.settings = incomingSettings;
    Store.state.goals = { items: ((s.goals || {}).items || []).slice() }; addedGoals = Store.state.goals.items.length;
  } else {
    const cur = Store.state.settings; const inc = Object.assign({}, s.settings || {}); delete inc.agreement;
    for (const k of Object.keys(inc)) if (cur[k] === undefined || cur[k] === '' ) cur[k] = inc[k];
    cur.customCats = mergeById(cur.customCats, inc.customCats).list;
    cur.accounts = mergeById(cur.accounts, inc.accounts).list;
    const g = mergeById((Store.state.goals || {}).items, (s.goals || {}).items);

  }
  if (keepAgreement) Store.state.settings.agreement = keepAgreement; else delete Store.state.settings.agreement;
  const ids = new Set(allTx().map((t) => String(t.id))); const add = [];
  let invalid = 0;
  for (const m of Object.keys(s.months)) for (const t of s.months[m]) { if (!t || !t.date || !/^\d{4}-\d{2}-\d{2}$/.test(t.date) || !(t.type === 'income' || t.type === 'expense') || !(Number(t.amount) > 0)) { invalid++; continue; } if (t.id != null && ids.has(String(t.id))) continue; add.push(t); if (t.id != null) ids.add(String(t.id)); }

    }

/* Tax effect of contributions already recorded: projection with vs. without them. */
function regTaxEffect(rrspAmt, fhsaAmt) {
  const withThem = projection();
  const without = projection({ extraRrsp: -rrspAmt, extraFhsa: -fhsaAmt });
  return { change: withThem.tax.totalOwing - without.tax.totalOwing, balanceWith: withThem.balance, balanceWithout: without.balance,

}

function compareResults() {
  const c = ui.cmp; const st = S(); const P = T.data(); const RG = P.registered; const amt = num(c.amount);
  if (!(amt > 0)) return `<section class="panel"><div class="empty"><b>Enter an amount</b><span>The table shows the estimated tax effect and cash-flow impact for each account side by side.</span></div></section>`;
  const rt = registeredTotals(YEAR);
  const base = projection({ noBusiness: !c.biz });
  const withRrsp = projection({ noBusiness: !c.biz, extraRrsp: amt });
  const withFhsa = projection({ noBusiness: !c.biz, extraFhsa: amt });
  const home = !!st.firstHomeBuyer;
  const fhsaOpenOk = st.fhsaOpened !== '' && +st.fhsaOpened <= YEAR;
  const rr = Registered.rrspRoom(P, { limit: st.rrspLimit, unused: st.rrspUnused, applied: rt.rrsp + amt });
  const fh = Registered.fhsaRoom(P, { openedYear: st.fhsaOpened || (home ? YEAR : ''), carryForward: st.fhsaCarry, contributedBefore: st.fhsaBefore, contributedThisYear: rt.fhsa + amt });
  const tf = Registered.tfsaRoom(P, { roomJan1: st.tfsaRoom, contributions: rt.tfsa + amt, withdrawals: rt.tfsaWd });
  const now = new Date(); const monthsLeft = 12 - now.getMonth();
  const perMonth = c.timing === 'spread' ? amt / monthsLeft : amt;
  const taxRrsp = withRrsp.tax.totalOwing - base.tax.totalOwing;
  const taxFhsa = withFhsa.tax.totalOwing - base.tax.totalOwing;
  const fmtTax = (d) => (d < -0.5 ? `<span class="pos">−${money(-d, true)}</span><br><span class="small muted">less tax (larger refund or smaller balance owing)</span>` : `${money(0, true)}<br><span class="small muted">no change</span>`);
  const fits = (r, entered) => (!entered ? '<span class="muted">Room not entered</span>' : r.over ? `<span class="neg">Over by ${money(r.over, true)}</span>` : `<span class="pos">Within room</span><br><span class="small muted">${money(r.left, true)} left after</span>`);
  const outflow = c.timing === 'spread' ? `−${money(perMonth, true)} a month for ${monthsLeft} month${monthsLeft > 1 ? 's' : ''}` : `−${money(amt, true)} this month`;
  const avg12 = (taxDelta) => money((amt + Math.min(0, taxDelta)) / 12, true);
  const cols = [
    { key: 'RRSP', ok: true, room: fits(rr, st.rrspLimit !== ''), ded: money(amt, true), tax: fmtTax(taxRrsp), out: outflow, net: money(amt + Math.min(0, taxRrsp), true), avg: '−' + avg12(taxRrsp),
      later: 'Withdrawals are added to taxable income in the year taken (tax is withheld). Room used is not restored.', marg: pct(T.marginalTaxRate(withRrsp.inp)) },
    { key: 'FHSA', ok: home, room: home ? fits(fh, fhsaOpenOk || true) : '—', ded: home ? money(amt, true) : '—', tax: home ? fmtTax(taxFhsa) : '—', out: home ? outflow : '—', net: home ? money(amt + Math.min(0, taxFhsa), true) : '—', avg: home ? '−' + avg12(taxFhsa) : '—',
      later: 'Qualifying withdrawals for a first home are tax-free. Other withdrawals are taxable.', marg: home ? pct(T.marginalTaxRate(withFhsa.inp)) : '—' },
    { key: 'TFSA', ok: true, room: fits(tf, st.tfsaRoom !== ''), ded: money(0, true), tax: fmtTax(0), out: outflow, net: money(amt, true), avg: '−' + money(amt / 12, true),
      later: 'Withdrawals are tax-free. The amount withdrawn is added back to your room on January 1 of the next year.', marg: pct(T.marginalTaxRate(base.inp)) },
    { key: 'Keep as cash', ok: true, room: 'No limit', ded: money(0, true), tax: fmtTax(0), out: `${money(0, true)}<br><span class="small muted">stays in your account</span>`, net: money(0, true), avg: money(0, true),
      later: 'Available any time. Interest earned is taxable each year.', marg: pct(T.marginalTaxRate(base.inp)) }
  ];
  const hb = Registered.hbp(P, amt, YEAR + 1);
  const rowsDef = [
    ['Room check', 'room'], [`Deduction on your ${YEAR} return`, 'ded'], [`Estimated change in ${YEAR} tax`, 'tax'], ['Estimated marginal tax rate after', 'marg'],
    ['Cash leaving your account', 'out'], ['Net cost after the estimated tax change', 'net'], ['Average monthly effect over 12 months', 'avg'], ['When money comes out', 'later']
  ];
  return `<section class="panel"><div class="panel-head"><h2>${money(amt, true)} side by side</h2><span class="small muted">Columns always appear in this same order and are not ranked. Review the numbers with a professional.</span></div>

function familyNote(t) {
  const st = S(); const P = T.prov(); const ans = st.hasPartner || ''; const L = t.prov.lowIncome; const name = P.name;
  const link = '<button class="btn sm" data-action="partner-settings">Spouse or partner details</button>';
  const box = (html, cls = 'warn') => `<div class="callout ${cls} family-note" role="note"><span style="flex:1">${html}</span>${link}</div>`;
  if (L && L.family === 'supported' && (L.available > 0 || L.usedFamily || t.prov.reduction > 0)) {
    if (L.usedFamily) return box(`The ${name} low-income tax reduction uses <b>family net income of ${money(L.incomeUsed, true)}</b> (yours plus the ${money(+st.partnerIncome || 0, true)} you entered for your spouse or partner), with the spouse amount added. ${L.unused > 0.5 ? `About ${money(L.unused, true)} of it is more than your ${name} tax; your spouse or partner may be able to claim that part on their return.` : ''} Couples choose who claims it, so the amount on your return may differ.`, 'plain');
    if (ans === 'no') return '';
    return box(`<b>The ${name} low-income tax reduction here assumes you have no spouse or common-law partner.</b> ${name} bases it on family income, so with a spouse or partner the amount could be higher or lower. Add their details to include them.`);
  }
  if (L && L.family === 'single-only' && (L.available > 0 || t.prov.reduction > 0)) {
    return box(`<b>The ${name} low-income tax reduction here is estimated as if you have no spouse or common-law partner.</b> ${name} bases it on family income${ans === 'yes' ? ', and MapleBook doesn\'t include partner income for ' + name + ' yet' : ''}, so the actual amount may be different.`, ans === 'yes' ? 'warn' : 'plain');
  }
  if (t.prov.code === 'ON' && t.prov.lift > 0 && ans !== 'no') {
    if (ans === 'yes') return box(`The Ontario LIFT credit includes your spouse or partner's ${money(+st.partnerIncome || 0, true)} in the family income test (family net income over $65,000 reduces it).`, 'plain');
    return box('<b>The Ontario LIFT credit here assumes you have no spouse or common-law partner.</b> It is reduced when family net income is over $65,000. Add their details to include them.');
  }
  return '';
}

/* ---------- Password-protected backups ---------- */
/* Base64 in 32 KB pieces: spreading a large buffer into String.fromCharCode overflows the call stack. */
const B64 = {
  enc(buf) {
    const bytes = new Uint8Array(buf); const CHUNK = 0x8000; let bin = '';
    for (let i = 0; i < bytes.length; i += CHUNK) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    return btoa(bin);
  },
  dec(s) { const bin = atob(s); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
};
const BACKUP_KDF_ITERATIONS = 600000;
async function backupKey(password, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptBackup(plainText, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await backupKey(password, salt, BACKUP_KDF_ITERATIONS);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plainText));
  return JSON.stringify({ app: 'maplebook', encrypted: true, format: 1, kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations: BACKUP_KDF_ITERATIONS, salt: B64.enc(salt) }, cipher: { name: 'AES-GCM', iv: B64.enc(iv) }, data: B64.enc(ct) });
}
async function decryptBackup(obj, password) {
  try {
    const key = await backupKey(password, B64.dec(obj.kdf.salt), +obj.kdf.iterations);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: B64.dec(obj.cipher.iv) }, key, B64.dec(obj.data));
    return { text: new TextDecoder().decode(pt) };
  } catch (e) { return { error: "That password doesn't open this backup. Check it and try again." }; }
}
function isEncryptedBackup(text) { try { const o = JSON.parse(text); return o && o.encrypted === true && o.kdf && o.cipher && o.data ? o : null; } catch (e) { return null; } }
function backupPlainText() { return JSON.stringify({ app: 'maplebook', version: 4, exported: new Date().toISOString(), counts: backupStats(Store.state), state: Store.state }, null, 1); }
function exportSheet() {
  const n = backupStats(Store.state);
  const sheet = openSheet(`<div class="sheet-head"><h2>Export backup</h2><button class="close" data-close aria-label="Close">×</button></div>
    <p class="muted">The backup file holds all ${n.tx} transactions, ${n.goals} goals and your settings. Anyone who opens the file can read them, so keep it somewhere private.</p>
    <label class="check"><input type="checkbox" id="bk-protect"><span><b>Protect with a password</b><br><span class="small muted">The file is encrypted (AES-256). You'll need the password to restore it. If you forget it, the backup can't be opened, and MapleBook can't recover it.</span></span></label>
    <div id="bk-pw" hidden class="form-grid" style="margin-top:8px">
      ${field('bk-pass', 'Password', '<input id="bk-pass" type="password" autocomplete="new-password" minlength="8">', 'At least 8 characters')}
      ${field('bk-pass2', 'Type it again', '<input id="bk-pass2" type="password" autocomplete="new-password">')}
    </div>
    <div class="btns" style="margin-top:12px"><button class="btn primary" id="bk-go">Export</button></div>`);
  sheet.addEventListener('change', (e) => { if (e.target.id === 'bk-protect') $('#bk-pw', sheet).hidden = !e.target.checked; });
  sheet.addEventListener('click', async (e) => {
    if (e.target.closest('[data-close]')) return closeSheet();
    if (!e.target.closest('#bk-go')) return;
    const go = $('#bk-go', sheet); const errBox = () => { let x = $('#bk-err', sheet); if (!x) { go.parentElement.insertAdjacentHTML('beforebegin', '<div id="bk-err" class="callout bad" role="alert" style="margin-top:12px"><span></span></div>'); x = $('#bk-err', sheet); } return x; };
    const protect = $('#bk-protect', sheet).checked;
    if (protect) {
      const p1 = $('#bk-pass', sheet).value, p2 = $('#bk-pass2', sheet).value;
      if (p1.length < 8) { toast('Use a password of at least 8 characters'); $('#bk-pass', sheet).focus(); return; }
      if (p1 !== p2) { toast("The two passwords don't match"); $('#bk-pass2', sheet).focus(); return; }
    }
    go.disabled = true; go.textContent = protect ? 'Encrypting…' : 'Preparing…';
    try {
      let data = backupPlainText();
      if (protect) data = await encryptBackup(data, $('#bk-pass', sheet).value);
      const saved = await saveBackupFile(data);
      closeSheet(); if (saved) noteBackupDone();
    } catch (err) {
      console.error(err);
      errBox().querySelector('span').textContent = "The backup couldn't be created" + (err && err.message ? ` (${err.message})` : '') + '. Nothing was changed. Try again, or export without a password.';
      go.disabled = false; go.textContent = 'Export';
    }
  });
}

/* ---------- Backup reminders ----------
   Android keeps MapleBook out of Google's automatic backups, so data that lives only on this device is lost
   with the phone. Remind gently when there's a month or more of data and no export in the last 30 days. */
const DAY_MS = 864e5;
function noteBackupDone() { setSetting('lastBackupAt', new Date().toISOString()); setSetting('backupReminderSnooze', ''); }
function backupReminderDue() {
  const st = S();
  if (Store.mode !== 'local' || !st.backupReminders) return false;   // synced data has another copy; demo has nothing to keep
  const now = Date.parse(todayIso() + 'T12:00:00');
  if (st.backupReminderSnooze && Date.parse(st.backupReminderSnooze) > now) return false;
  if (st.lastBackupAt && now - Date.parse(st.lastBackupAt) < 30 * DAY_MS) return false;
  const real = allTx().filter((t) => !t.sample); if (!real.length) return false;
  const dates = real.map((t) => Date.parse(t.date + 'T12:00:00')).filter((x) => !isNaN(x));
  const created = real.map((t) => +t.created).filter((x) => x > 0);
  const spanDays = dates.length ? (Math.max(...dates) - Math.min(...dates)) / DAY_MS : 0;
  const ageDays = created.length ? (now - Math.min(...created)) / DAY_MS : 0;
  return spanDays >= 30 || ageDays >= 30;
}
function backupReminder() {
  if (!backupReminderDue()) return '';
  const st = S(); const last = st.lastBackupAt ? fmtDate(st.lastBackupAt.slice(0, 10), { month: 'long', day: 'numeric', year: 'numeric' }) : '';
  return `<div class="callout plain" role="note" id="backup-reminder"><div style="flex:1 1 14rem"><b>Time to save a backup?</b>
    <p class="small" style="margin:4px 0 0">${last ? `Your last backup was on ${last}.` : "You haven't exported a backup yet."} Your MapleBook data is stored only on this device${window.AndroidBridge ? " and isn't included in your phone's automatic Google backup" : ''}. A backup file lets you bring it back on a new phone or after reinstalling.</p></div>
    <div class="btns" style="align-self:center"><button class="btn sm primary" data-action="export">Export backup</button><button class="btn sm" data-action="backup-snooze">Not now</button><button class="btn sm ghost" data-action="backup-reminders-off">Turn off reminders</button></div></div>`;
}
function backupHelp() {
  const st = S();
  return `<details class="more" id="backup-help"${Store.mode === 'local' ? '' : ''}><summary>New phone, or uninstalling MapleBook?</summary>
    <p class="small">${Store.mode === 'supabase' ? 'Cloud sync is on, so your data is also stored in your account: sign in on the new phone and it comes back.' : `Your data is stored only on this device${window.AndroidBridge || Store.syncAvailable ? ". MapleBook isn't included in Android's automatic backups or phone-to-phone transfers, so uninstalling the app or switching phones removes it" : ', in this browser'}.`}
    Before you uninstall or switch, export a backup (Settings → Your data → Export backup)${Store.syncAvailable && Store.mode !== 'supabase' ? ' or turn on cloud sync' : ''}. On the new phone, install MapleBook and choose Restore from backup.</p></details>
    ${Store.mode === 'local' ? `<div class="toggle-row"><span>Remind me to export a backup<br><span class="small muted">When there's a month or more of data and no backup in the last 30 days.</span></span>${sw('s-backupReminders', st.backupReminders)}</div>` : ''}`;
}

/* ================= Savings goals (free) =================
   Create, edit and delete goals and track progress toward them. Free for everyone, and never tied to a tax year.
   The big-purchase planner, the new-expense check and the emergency-fund test stay in MapleBook Plus. */
function goalsList() { Store.state.goals = Store.state.goals || { items: [] }; Store.state.goals.items = Store.state.goals.items || []; return Store.state.goals.items; }
function defaultGoalDate() { const d = new Date(); d.setMonth(d.getMonth() + 12); return d.toISOString().slice(0, 10); }

function viewGoals() {
  const goals = goalsList();
  const saved = goals.reduce((a, g) => a + (+g.saved || 0), 0), target = goals.reduce((a, g) => a + (+g.target || 0), 0);
  return `<div class="page-head"><div><span class="eyebrow">Planner</span><h1>Savings goals</h1><p>Set a target and a date, then add to it as you save.</p></div>${planSeg()}</div>
    <section class="panel" id="goals-panel"><div class="panel-head"><div><h2>Your goals</h2>${goals.length ? `<span class="small muted num">${money(saved, true)} saved of ${money(target, true)}</span>` : ''}</div><button class="btn sm primary" data-action="goal-new">New goal</button></div>
      ${goals.length ? `<div class="grid" style="gap:16px">${goals.map((g, i) => goalRow(g, i)).join('')}</div>`
        : `<div class="empty"><b>No goals yet</b><span>A trip, a new laptop, a down payment: add a goal to see what to put aside each month.</span><button class="btn sm" data-action="goal-new">New goal</button></div>`}
    </section>
    ${Entitlements.has('planner') ? '' : `<p class="small muted">The big-purchase planner, new-expense check and emergency-fund test are part of MapleBook Plus.</p>`}`;
}

/** Sheet to create (i undefined) or edit goal i. */
function goalSheet(i) {
  const editing = Number.isInteger(i) && goalsList()[i];
  const g = editing ? goalsList()[i] : { name: '', target: '', saved: '', date: defaultGoalDate() };

/* ---- household.js ---- */
/* ================= Households (couples and family budgeting) =================
   A household is a shared space on the server (Supabase) for up to 6 signed-in people. Each person's personal
   budget stays on their phone (and in their own private account copy if they're signed in); only items they put in
   the household are shared:
     tx          a shared transaction { date, amount, type, cat, desc, note, paidBy }
     bill        a shared bill { name, amount, day }
     goal        a shared savings goal { name, target, saved, date }
     settlement  a settle-up payment { from, to, amount, date }
   Phones keep a copy of the household and a queue of changes (outbox), so it works offline and syncs back later.
   Access rules on the server (android/supabase/schema.sql) make sure only active members can read or change it,
   and that nobody can see another member's personal data. */

/* ---------- Settle-up math (pure; tested in tests/household_math.mjs) ---------- */
const cents = (x) => Math.round(x * 100) / 100;
/** Balances and the fewest payments that settle them.
    items: household items; members: active member ids; pct: { id: percent } (adds up to 100).
    Only shared expenses paid by active members count; settle-up payments move money between members.
    balance > 0: the household owes them; < 0: they owe. */
function settleUp(items, members, pct) {
  const ids = members.slice(); const paid = {}, owed = {}, bal = {};
  for (const id of ids) { paid[id] = 0; owed[id] = 0; bal[id] = 0; }
  let total = 0;
  for (const it of items) {
    if (it.deleted) continue; const d = it.data || {};
    if (it.kind === 'tx' && d.type !== 'income' && ids.includes(d.paidBy) && +d.amount > 0) { total += +d.amount; paid[d.paidBy] += +d.amount; }
  }
  for (const id of ids) owed[id] = total * (+pct[id] || 0) / 100;
  for (const id of ids) bal[id] = paid[id] - owed[id];
  for (const it of items) {
    if (it.deleted || it.kind !== 'settlement') continue; const d = it.data || {};
    if (ids.includes(d.from) && ids.includes(d.to) && +d.amount > 0) { bal[d.from] += +d.amount; bal[d.to] -= +d.amount; }
  }
  for (const id of ids) { paid[id] = cents(paid[id]); owed[id] = cents(owed[id]); bal[id] = cents(bal[id]); }
  // greedy: the largest debtor pays the largest creditor until everyone is within a cent
  const debt = ids.filter((i) => bal[i] < -0.004).map((i) => ({ id: i, v: -bal[i] })).sort((a, b) => b.v - a.v);
  const cred = ids.filter((i) => bal[i] > 0.004).map((i) => ({ id: i, v: bal[i] })).sort((a, b) => b.v - a.v);
  const transfers = [];
  while (debt.length && cred.length) {
    const d = debt[0], c = cred[0]; const amt = cents(Math.min(d.v, c.v));
    if (amt >= 0.01) transfers.push({ from: d.id, to: c.id, amount: amt });
    d.v = cents(d.v - amt); c.v = cents(c.v - amt);
    if (d.v < 0.01) debt.shift(); if (c.v < 0.01) cred.shift();
    debt.sort((a, b) => b.v - a.v); cred.sort((a, b) => b.v - a.v);
  }
  return { total: cents(total), paid, owed, balance: bal, transfers };
}
/** Percentages for a split, worked out on the phone for 'equal' (the server gives income and custom ones). */
function equalSplit(ids) { const out = {}; for (const id of ids) out[id] = 100 / ids.length; return out; }

const HH_KEY = 'maplebook-household';

  info: null, members: [], items: {}, income: null, split: null, outbox: [], me: null, lastSync: null, loading: false, error: '',
  _ch: null, _timer: null,
  sb() { return Store.mode === 'supabase' ? Store._sb : null; },
  active() { return !!this.info; },
  isOwner() { return !!this.info && this.info.owner_id === this.me; },
  activeMembers() { return this.members.filter((m) => !m.left_at).sort((a, b) => String(a.joined_at).localeCompare(String(b.joined_at))); },
  memberIds() { return this.activeMembers().map((m) => m.user_id); },
  nameOf(uid, you = true) { if (uid === this.me && you) return tr('You'); const m = this.members.find((x) => x.user_id === uid); return m ? m.display_name : tr('Former member'); },
  myRow() { return this.members.find((m) => m.user_id === this.me && !m.left_at) || null; },
  list(kind) { return Object.values(this.items).filter((i) => i.kind === kind && !i.deleted); },

  save() {

  },
  restore() {

  },
  /** Load (or reload) the household from the server; keeps the cached copy when offline. */
  async load() {
    const sb = this.sb(); if (!sb) return;
    if (this.me !== Store.uid) { this.reset(); this.me = Store.uid; this.restore(); this.me = Store.uid; }
    this.loading = true;
    try {
      await this.flush();
      const st = await refreshPlusStatus();

      if (!st) return;                                     // offline: keep the cached copy
      if (!hid) { this.reset(); this.me = Store.uid; return; }       // not in a household (or removed): nothing shared is kept
      const [h, m, it] = await Promise.all([
        sb.from('households').select('id,name,owner_id,invite_code,split_mode').eq('id', hid),
        sb.from('household_members').select('user_id,display_name,role,joined_at,left_at,income_visibility,custom_pct').eq('household_id', hid),

  async loadNumbers() {

/* ---------- Settle up ---------- */

        ${members.map((m) => `<tr><td translate="no">${esc(Household.nameOf(m.user_id))}</td><td class="num">${money(res.paid[m.user_id])}</td><td class="num">${pctText(pct[m.user_id])} · ${money(res.owed[m.user_id])}</td><td class="num ${res.balance[m.user_id] >= 0 ? 'pos' : 'neg'}">${res.balance[m.user_id] >= 0 ? '+' : '−'}${money(Math.abs(res.balance[m.user_id]))}</td></tr>`).join('')}

/* ---------- CSV export of shared data ---------- */
function hhCsv() {
  const q = (x) => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
  const lines = [['Kind', 'Date', 'Description or name', 'Category', 'Amount', 'Paid by / from', 'To', 'Note'].map(q).join(',')];
  for (const i of Object.values(Household.items).filter((x) => !x.deleted).sort((a, b) => String(a.data.date || '').localeCompare(String(b.data.date || '')))) {
    const d = i.data;
    lines.push([i.kind, d.date || '', d.desc || d.name || '', d.cat ? catName(d.type || 'expense', d.cat) : '', d.amount != null ? d.amount : d.target, Household.nameOf(d.paidBy || d.from, false), d.to ? Household.nameOf(d.to, false) : '', d.note || ''].map(q).join(','));
  }
  return lines.join('\n');
}
async function hhExport() {
  const data = hhCsv(); const name = `maplebook-household-${todayIso()}.csv`;
  if (window.AndroidBridge && window.AndroidBridge.saveFile) { window.AndroidBridge.saveFile(name, data); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('Shared data exported');
}

/* ---------- Events ---------- */
function bindHousehold() {

}
document.addEventListener('change', (e) => {

document.addEventListener('click', async (e) => {

  const a = b.dataset.action; if (!a.startsWith('hh-') && b.dataset.seg !== 'hhmode') return;
  const val = (id) => ($(id) || {}).value || '';

  else if (a === 'hh-create') { const n = val('#hh-name').trim(), me = val('#hh-me').trim(); if (!n || !me) { toast(!n ? 'Give the household a name' : 'Enter your name for the household'); return; } setSetting('hhName', me); await busy(async () => { await Household.create(n, me); toast('Household created. Invite others from Members.'); ui.hhMode = 'members'; }); }

/* ---- feedback.js ---- */
/* ---------- Help & feedback ----------
   People send a problem, idea, question or "something confusing" from any screen. It works with or without an
   account and offline (saved here, sent when back online). Each item gets a random private token kept only on this
   phone, so its status ("Planned", "Done"...) and any reply can be shown later in "My feedback".
   Sent: the type, the message, the screen it's about, an optional screenshot, and app version / Android version /
   language. Never budget data, amounts or other figures. Server: supabase/functions/_shared/forms.js and the
   feedback table in supabase/schema.sql. */
const APP_VERSION = '1.0.1';
const FEEDBACK_KEY = 'maplebook-feedback';
const FB_TYPES = [['problem', 'Problem'], ['idea', 'Idea'], ['question', 'Question'], ['confusing', 'Something confusing']];
const FB_STATUS = { received: 'Received', planned: 'Planned', in_progress: 'In progress', done: 'Done', not_planned: 'Not planned' };
const FB_SCREENS = [['home', 'Overview'], ['money', 'Transactions'], ['household', 'Household'], ['tax', 'Tax'], ['pay', 'Paycheque'], ['plan', 'Planner'], ['settings', 'Settings'], ['other', 'Something else']];
const FB_MAX_SHOT = 1.5 * 1024 * 1024;   // kept under the server's 2 MB, and small enough to wait offline on the phone

const Feedback = {
  items: [],
  load() { try { this.items = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || '[]'); } catch (e) { this.items = []; } return this; },
  save() { try { localStorage.setItem(FEEDBACK_KEY, JSON.stringify(this.items)); } catch (e) { /* a screenshot too big to keep: drop it rather than the message */ for (const i of this.items) if (i.sent) delete i.shot; try { localStorage.setItem(FEEDBACK_KEY, JSON.stringify(this.items)); } catch (e2) {} } },
  cfg() { const c = window.LEDGER_CONFIG || {}; return c.supabaseUrl && c.supabaseKey ? c : null; },
  available() { return !!this.cfg() && Store.mode !== 'demo'; },
  appVersion() { return /^\d/.test(APP_VERSION) ? APP_VERSION : 'dev'; },
  osVersion() { const m = (navigator.userAgent || '').match(/Android [\d.]+/); return m ? m[0] : (window.AndroidBridge ? 'Android' : 'Web'); },
  token() { const b = new Uint8Array(24); crypto.getRandomValues(b); return [...b].map((x) => x.toString(16).padStart(2, '0')).join(''); },
  async hash(s) { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, '0')).join(''); },
  async headers() {
    const c = this.cfg(); let bearer = c.supabaseKey;
    try { if (Store.mode === 'supabase' && Store._sb) { const { data } = await Store._sb.auth.getSession(); if (data && data.session && data.session.access_token) bearer = data.session.access_token; } } catch (e) {}
    // The new "publishable" keys (sb_publishable_...) go in the apikey header only; as a Bearer token they can be
    // rejected as "Invalid JWT". A signed-in person's own access token still goes in Authorization.
    const h = { 'Content-Type': 'application/json', apikey: c.supabaseKey };
    if (bearer && !/^sb_publishable_/.test(bearer)) h.Authorization = 'Bearer ' + bearer;
    return h;
  },
  /** What is sent with every message, shown on the form too. */
  details(screen) { return { appVersion: this.appVersion(), osVersion: this.osVersion(), lang: isFr() ? 'fr' : 'en', screen }; },
  async add({ type, message, screen, notify, shot }) {
    const token = this.token();
    const it = { local: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), token, tokenHash: await this.hash(token), created: new Date().toISOString(),
      type, message, screen, notify: notify !== false, lang: isFr() ? 'fr' : 'en', shot: shot || null, sent: false, status: 'received', reply: '', seen: '' };
    this.items.unshift(it); this.save();
    await this.flush();
    return it;
  },
  /** Send everything that's waiting. Returns 'sent', 'offline', 'limit' or 'error' for the newest item. */
  async flush() {
    if (!this.available() || this._flushing) return 'offline';
    this._flushing = true; let last = 'sent';
    try {
      const c = this.cfg();
      for (const it of this.items.filter((x) => !x.sent && !x.failed).reverse()) {
        const body = { action: 'feedback', token: it.token, type: it.type, message: it.message, notify: it.notify, source: 'app', ...this.details(FB_SCREENS.find(([k]) => k === it.screen) ? (FB_SCREENS.find(([k]) => k === it.screen)[1]) : it.screen) };
        body.lang = it.lang;
        if (it.shot) body.screenshot = { type: it.shot.type, data: it.shot.data };
        let res;
        try { res = await fetch(c.supabaseUrl + '/functions/v1/forms', { method: 'POST', headers: await this.headers(), body: JSON.stringify(body) }); }
        catch (e) { last = 'offline'; break; }
        if (res.status === 429) { last = 'limit'; break; }
        if (!res.ok) { it.failed = true; last = 'error'; continue; }
        const j = await res.json().catch(() => ({}));
        it.sent = true; it.id = j.id || null; it.sentAt = new Date().toISOString(); delete it.shot; it.hadShot = !!body.screenshot;
        this.save();
      }
    } finally { this._flushing = false; }
    if (typeof updateFeedbackBadge === 'function') updateFeedbackBadge();
    return last;
  },
  /** Statuses and replies from Maple Book Software. Signed in: also items sent from other devices. */
  async refresh() {
    if (!this.available()) return;
    const tokens = this.items.filter((x) => x.sent).map((x) => x.token);
    if (!tokens.length && Store.mode !== 'supabase') return;
    try {
      const c = this.cfg();
      const res = await fetch(c.supabaseUrl + '/rest/v1/rpc/my_feedback', { method: 'POST', headers: await this.headers(), body: JSON.stringify({ p_tokens: tokens }) });
      if (!res.ok) return;
      const list = await res.json();
      for (const r of Array.isArray(list) ? list : []) {
        let it = this.items.find((x) => x.tokenHash === r.token_hash || (x.id && x.id === r.id));
        if (!it) { it = { local: 'r' + r.id, remote: true, tokenHash: r.token_hash, id: r.id, created: r.created_at, type: r.type, message: r.message, screen: r.screen, notify: r.notify, sent: true, seen: '' }; this.items.push(it); }
        it.status = r.status || 'received'; it.reply = r.reply || ''; it.id = r.id;
      }
      this.items.sort((a, b) => String(b.created).localeCompare(String(a.created)));
      this.save(); this.lastCheck = Date.now();
    } catch (e) { /* offline: keep what we have */ }
    if (typeof updateFeedbackBadge === 'function') updateFeedbackBadge();
  },
  sig(it) { return (it.status || 'received') + '|' + (it.reply || ''); },
  /** Items with news the person asked to hear about. */
  unread() { return this.items.filter((it) => it.sent && it.notify && (it.status !== 'received' || it.reply) && it.seen !== this.sig(it)); },
  markSeen() { for (const it of this.items) if (it.sent) it.seen = this.sig(it); this.save(); updateFeedbackBadge(); }
};

/* ---------- Screenshot: shrink on the phone so it stays under the limit ---------- */
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('not-image'));
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      try {
        let w = img.naturalWidth, h = img.naturalHeight; const max = 1600; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
        let q = 0.82, data = '';
        for (let i = 0; i < 6; i++) { data = cv.toDataURL('image/jpeg', q).split(',')[1]; if (data.length * 0.75 <= FB_MAX_SHOT) break; q -= 0.12; }
        URL.revokeObjectURL(url);
        if (data.length * 0.75 > FB_MAX_SHOT) return reject(new Error('too-big'));
        resolve({ type: 'image/jpeg', data, w, h });
      } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('not-image')); };
    img.src = url;
  });
}

}

/* ---------- The feedback form ---------- */
function feedbackSheet(opts = {}) {
  const screen = opts.screen || (FB_SCREENS.some(([k]) => k === ui.view) ? ui.view : 'other');
  const st = { type: opts.type || 'problem', shot: null, sending: false, msg: '' };
  if (!Feedback.available()) {
    const s = openSheet(`<div class="sheet-head"><h2>Send feedback</h2><button class="close" data-close aria-label="Close">×</button></div>
      <p>Feedback isn't available in this version. Use the feedback page on our website:</p>
      <p><a class="btn" href="${LEGAL.website}/${isFr() ? 'fr/' : ''}feedback.html" target="_blank" rel="noopener">Open the feedback page</a></p>`);
    s.id = 'feedback-sheet'; return s;
  }
  const d = Feedback.details(FB_SCREENS.find(([k]) => k === screen)[1]);
  const draw = () => `<div class="sheet-head"><div><span class="eyebrow">Help &amp; feedback</span><h2>Send feedback</h2></div><button class="close" data-close aria-label="Close">×</button></div>
    <form id="fb-form" class="grid" novalidate>
      <div class="field"><span class="lbl" id="fb-type-l">What is it?</span><div class="seg seg-wrap" role="group" aria-labelledby="fb-type-l">${FB_TYPES.map(([k, l]) => `<button type="button" data-fbtype="${k}" aria-pressed="${st.type === k}">${l}</button>`).join('')}</div></div>
      ${field('fb-msg', st.type === 'problem' ? 'What happened? What did you expect?' : st.type === 'idea' ? 'What would make MapleBook better for you?' : st.type === 'question' ? 'What would you like to know?' : 'What was confusing?', '<textarea id="fb-msg" rows="5" maxlength="4000" required></textarea>', 'Please don\'t include passwords, account numbers or other private details.')}
      ${field('fb-screen', 'Which screen is it about?', `<select id="fb-screen">${FB_SCREENS.map(([k, l]) => `<option value="${k}" ${k === screen ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}
      <div class="field"><span class="lbl">Screenshot (optional)</span>
        ${st.shot ? `<div class="fb-shot"><img src="data:${st.shot.type};base64,${st.shot.data}" alt="Your screenshot"><button type="button" class="btn sm" data-fb="noshot">Remove screenshot</button></div>`
          : '<label class="btn sm fb-pick" for="fb-file">Add a screenshot</label><input id="fb-file" type="file" accept="image/*" class="visually-hidden">'}
        <span class="small muted">Check it shows nothing private before you send it.</span></div>
      <label class="toggle-row fb-notify"><span>Let me know when this is addressed<br><span class="small muted">You'll see it in My feedback. No emails.</span></span><input type="checkbox" id="fb-notify" checked></label>
      <div class="callout" role="note" id="fb-details"><span><b>Sent with your message:</b> app version <span translate="no">${esc(d.appVersion)}</span>, <span translate="no">${esc(d.osVersion)}</span>, <span>${d.lang === 'fr' ? 'French' : 'English'}</span>, and the screen you chose. <b>Never</b> your budget, transactions, amounts or account details.</span></div>
      ${st.msg ? `<div class="callout warn" role="alert"><span>${esc(st.msg)}</span></div>` : ''}
      <div class="btns sticky-actions"><button class="btn primary" type="submit" ${st.sending ? 'disabled' : ''}>${st.sending ? 'Sending…' : 'Send feedback'}</button></div>
    </form>`;
  const sheet = openSheet(draw()); sheet.id = 'feedback-sheet';
  const keep = () => { const m = $('#fb-msg', sheet), sc = $('#fb-screen', sheet), no = $('#fb-notify', sheet); return { m: m ? m.value : '', sc: sc ? sc.value : screen, no: no ? no.checked : true }; };
  const redraw = () => { const k = keep(); const top = sheet.scrollTop; sheet.innerHTML = draw(); $('#fb-msg', sheet).value = k.m; $('#fb-screen', sheet).value = k.sc; $('#fb-notify', sheet).checked = k.no; sheet.scrollTop = top; bindFile(); };
  const bindFile = () => {
    const f = $('#fb-file', sheet); if (!f) return;
    f.addEventListener('change', async () => {
      const file = f.files && f.files[0]; if (!file) return;
      try { st.shot = await shrinkImage(file); st.msg = ''; } catch (e) { st.msg = e.message === 'too-big' ? 'That picture is too big. Try a smaller screenshot.' : 'That file isn\'t a picture. Choose a screenshot (PNG or JPEG).'; }
      redraw();
    });
  };
  bindFile();
  setTimeout(() => { const m = $('#fb-msg', sheet); if (m) m.focus(); }, 60);
  sheet.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-close')) return closeSheet();
    if (b.dataset.fbtype) { st.type = b.dataset.fbtype; redraw(); return; }
    if (b.dataset.fb === 'noshot') { st.shot = null; redraw(); }
  });
  sheet.addEventListener('submit', async (e) => {
    e.preventDefault();
    const k = keep(); const message = k.m.trim();
    if (!message) { st.msg = 'Write a few words first.'; redraw(); $('#fb-msg', sheet).focus(); return; }
    st.sending = true; redraw();
    await Feedback.add({ type: st.type, message, screen: k.sc, notify: k.no, shot: st.shot });
    const newest = Feedback.items[0];
    closeSheet();
    toast(newest.sent ? 'Thanks! Your feedback was sent.' : newest.failed ? 'Your feedback couldn\'t be sent. It\'s kept in My feedback.' : 'Saved. It will be sent when you\'re back online.');
    if (ui.view === 'settings') render(); else updateFeedbackBadge();
  });
  return sheet;
}

/* ---------- My feedback ---------- */
function myFeedbackSheet() {
  const draw = () => {
    const list = Feedback.items;
    return `<div class="sheet-head"><div><span class="eyebrow">Help &amp; feedback</span><h2>My feedback</h2></div><button class="close" data-close aria-label="Close">×</button></div>
      ${list.length ? `<div class="fb-list">${list.map((it) => {
        const news = it.sent && it.notify && (it.status !== 'received' || it.reply) && it.seen !== Feedback.sig(it);
        const state = !it.sent ? (it.failed ? '<span class="chip bad">Couldn\'t be sent</span>' : '<span class="chip warn">Waiting to send</span>') : `<span class="chip st-${esc(it.status || 'received')}">${FB_STATUS[it.status] || 'Received'}</span>`;
        return `<article class="fb-item ${news ? 'news' : ''}"><div class="fb-top">${state}<span class="small muted"><span>${(FB_TYPES.find(([k]) => k === it.type) || ['', ''])[1]}</span> · <span>${fmtDate(String(it.created).slice(0, 10), { month: 'short', day: 'numeric', year: 'numeric' })}</span></span>${news ? '<span class="chip good">New</span>' : ''}</div>
          <p class="fb-msg" translate="no">${esc(it.message)}</p>
          ${it.reply ? `<div class="fb-reply"><b>Reply from <span translate="no">${esc(LEGAL.publisher)}</span></b><p translate="no">${esc(it.reply)}</p></div>` : ''}
          ${it.failed ? `<div class="btns"><button class="btn sm" data-fbretry="${esc(it.local)}">Try again</button></div>` : ''}</article>`;
      }).join('')}</div>` : '<div class="empty"><span>Nothing sent yet. Tap "Send feedback" to tell us what you think.</span></div>'}
      <div class="btns"><button class="btn primary" data-action="feedback">Send feedback</button><button class="btn" data-fb="refresh">Check for updates</button></div>`;
  };
  const sheet = openSheet(draw()); sheet.id = 'my-feedback-sheet';
  const after = () => { if (!document.body.contains(sheet)) return; sheet.innerHTML = draw(); Feedback.markSeen(); };
  Feedback.flush().then(() => Feedback.refresh()).then(after);
  sheet.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-close')) { closeSheet(); if (ui.view === 'settings') render(); return; }
    if (b.dataset.action === 'feedback') { closeSheet(); feedbackSheet(); return; }
    if (b.dataset.fb === 'refresh') { b.disabled = true; await Feedback.flush(); await Feedback.refresh(); after(); toast('Up to date'); return; }
    if (b.dataset.fbretry) { const it = Feedback.items.find((x) => x.local === b.dataset.fbretry); if (it) { delete it.failed; Feedback.save(); } const r = await Feedback.flush(); after(); toast(r === 'sent' ? 'Sent' : r === 'offline' ? 'Still offline. It will be sent later.' : 'It couldn\'t be sent.'); }
  });
  return sheet;
}

/** Which guide goes with the screen that is open now (null for none). */
function guideFor() {
  if (ui.view === 'home') return 'overview';
  if (ui.view === 'money') return 'money';
  if (ui.view === 'household') return ui.hhMode === 'settle' ? 'settle' : 'household';
  if (['pay', 'tax', 'plan'].includes(ui.view)) return ui.view;
  return null;
}
function guidesSeen() { return (S().guidesSeen || {}); }
function markGuideSeen(id) {
  ui.guideDismissed = Object.assign(ui.guideDismissed || {}, { [id]: true });       // works in the view-only demo too
  if (Store.mode === 'demo') return;
  const st = Store.state.settings; st.guidesSeen = Object.assign({}, st.guidesSeen || {}, { [id]: true }); Store.touch('settings');
}
/** The small "30-second guide" card, offered once per screen. */
function guideOffer() {
  const id = guideFor(); if (!id || !GUIDES[id] || S().guidesOff) return '';
  if (guidesSeen()[id] || (ui.guideDismissed || {})[id]) return '';
  return `<section class="panel guide-offer" id="guide-offer" translate="no" lang="${isFr() ? 'fr' : 'en'}"><div><b>${L2('New here?', 'Nouveau ici?')}</b> <span>${L2('A 30-second guide to this screen.', 'Un guide de 30 secondes pour cet écran.')}</span></div>
    <div class="btns"><button type="button" class="btn sm primary" data-action="guide-open" data-g="${id}">${L2('Show me', 'Montrez-moi')}</button><button type="button" class="btn sm ghost" data-action="guide-dismiss" data-g="${id}">${L2('No thanks', 'Non merci')}</button></div></section>`;
}
function guideSheet(id, step = 0) {
  const g = GUIDES[id]; if (!g) return null;
  const steps = g.steps(); let i = Math.max(0, Math.min(step, steps.length - 1));
  const draw = () => `<div class="sheet-head" translate="no"><div><span class="eyebrow">${L2('Guide', 'Guide')} · ${i + 1} / ${steps.length}</span><h2>${esc(g.title())}</h2></div><button class="close" data-close aria-label="${L2('Close', 'Fermer')}">×</button></div>
    <div class="guide-step" translate="no" lang="${isFr() ? 'fr' : 'en'}" aria-live="polite"><h3>${esc(steps[i][0])}</h3><p>${esc(steps[i][1])}</p></div>
    <div class="guide-dots" aria-hidden="true">${steps.map((_, k) => `<span class="${k === i ? 'on' : ''}"></span>`).join('')}</div>
    <div class="sheet-actions" translate="no"><button type="button" class="btn ghost" data-gx="skip">${L2('Skip guide', 'Passer le guide')}</button>
      <div class="btns">${i > 0 ? `<button type="button" class="btn" data-gx="back">${L2('Back', 'Retour')}</button>` : ''}<button type="button" class="btn primary" data-gx="${i < steps.length - 1 ? 'next' : 'done'}">${i < steps.length - 1 ? L2('Next', 'Suivant') : L2('Done', 'Terminé')}</button></div></div>`;
  const sheet = openSheet(draw()); sheet.id = 'guide-sheet'; markGuideSeen(id);
  sheet.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return; if (b.hasAttribute('data-close')) return closeSheet();
    const a = b.dataset.gx; if (!a) return;
    if (a === 'next') i++; else if (a === 'back') i--; else { closeSheet(); render(); return; }
    sheet.innerHTML = draw(); const f = $('[data-gx=next], [data-gx=done]', sheet); if (f) f.focus({ preventScroll: true });
  });
  return sheet;
}

      [L2('EI fills part of the gap', 'L\'AE comble une partie de l\'écart'), L2(`If you lose a job and qualify, EI regular benefits are usually ${gPct(ei.benefitRate)} of average insurable earnings, up to ${g$(ei.maxWeekly)} a week, after a waiting period. That is often less than take-home pay.`, `Si vous perdez un emploi et êtes admissible, les prestations régulières d'AE sont habituellement de ${gPct(ei.benefitRate)} de la rémunération assurable moyenne, jusqu'à ${g$(ei.maxWeekly)} par semaine, après un délai de carence. C'est souvent moins que la paie nette.`)],
      [L2('Where people keep it', 'Où on le garde'), L2('Somewhere easy to reach and separate from everyday spending, such as a savings account or a TFSA in savings. The Planner\'s emergency-fund test shows how long your savings would last.', 'Dans un endroit facile d\'accès et séparé des dépenses courantes, comme un compte d\'épargne ou un CELI en épargne. Le test du fonds d\'urgence du planificateur montre combien de temps votre épargne durerait.')]
    ]; } }
};
const LESSON_ORDER = ['paycheque', 'accounts', 'brackets', 'couples', 'emergency'];
const PROV_NAME_EN = (c) => { try { return T.data().provinces[c].name; } catch (e) { return c; } };
const PROV_NAME_FR_EN = (c) => { const n = PROV_NAME_EN(c); return (typeof PROV_EN !== 'undefined' && PROV_EN[n]) || ('en ' + ((typeof PROV_FR !== 'undefined' && PROV_FR[n]) || n)); };

function learnSheet(id) {
  const drawList = () => `<div class="sheet-head" translate="no"><div><span class="eyebrow">${L2('Learn', 'Apprendre')}</span><h2>${L2('Short lessons', 'Courtes leçons')}</h2></div><button class="close" data-close aria-label="${L2('Close', 'Fermer')}">×</button></div>
    <div translate="no" lang="${isFr() ? 'fr' : 'en'}"><p class="small muted">${L2(`Plain-language lessons with the ${YEAR} numbers. About 2 minutes each.`, `Des leçons en termes simples avec les chiffres de ${YEAR}. Environ 2 minutes chacune.`)}</p>
    <div class="learn-list">${LESSON_ORDER.map((k) => `<button type="button" class="learn-item" data-lesson="${k}"><b>${esc(LESSONS[k].title())}</b><span aria-hidden="true">›</span></button>`).join('')}</div>
    <h3 style="margin-top:18px">${L2('Guides to each screen', 'Guides de chaque écran')}</h3>
    <div class="learn-list">${GUIDE_ORDER.map((k) => `<button type="button" class="learn-item" data-guide="${k}"><b>${esc(GUIDES[k].title())}</b><span aria-hidden="true">›</span></button>`).join('')}</div>
    <p class="small muted">${NOT_ADVICE()}</p></div>`;
  const drawLesson = (k) => { const l = LESSONS[k]; const parts = l.body();
    return `<div class="sheet-head" translate="no"><div><span class="eyebrow">${L2('Learn', 'Apprendre')}</span><h2>${esc(l.title())}</h2></div><button class="close" data-close aria-label="${L2('Close', 'Fermer')}">×</button></div>
      <article class="lesson" translate="no" lang="${isFr() ? 'fr' : 'en'}">${parts.map(([h, p]) => `<h3>${esc(h)}</h3><p>${esc(p)}</p>`).join('')}
        <p class="callout"><span>${NOT_ADVICE()}</span></p></article>
      <div class="sheet-actions" translate="no"><button type="button" class="btn" data-lx="list">${L2('All lessons', 'Toutes les leçons')}</button>${l.link[0] === 'household' && !Store.syncAvailable ? `<span class="small muted" id="lesson-nolink">${L2('Households are in the MapleBook Android app.', 'Les ménages sont dans l\'application Android MapleBook.')}</span>` : `<button type="button" class="btn primary" data-lx="go" data-to="${l.link[0]}">${esc(l.link[1]())}</button>`}</div>`; };
  const sheet = openSheet(id ? drawLesson(id) : drawList()); sheet.id = 'learn-sheet';
  sheet.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return; if (b.hasAttribute('data-close')) return closeSheet();
    if (b.dataset.lesson) { sheet.innerHTML = drawLesson(b.dataset.lesson); sheet.scrollTop = 0; return; }
    if (b.dataset.guide) { guideSheet(b.dataset.guide); return; }
    if (b.dataset.lx === 'list') { sheet.innerHTML = drawList(); sheet.scrollTop = 0; return; }
    if (b.dataset.lx === 'go') {
      const [v, mode] = b.dataset.to.split(':'); closeSheet();
      // no Household tab yet: open the Settings section where households are turned on
      if (v === 'household' && typeof showHouseholdTab === 'function' && !showHouseholdTab()) { ui.view = 'settings'; render(); const u = $('#usage-panel'); if (u) u.scrollIntoView({ block: 'start' }); return; }
      ui.view = v; if (v === 'plan' && mode) ui.planMode = mode; render(); window.scrollTo({ top: 0 });
    }
  });
  return sheet;
}
/** Settings → Help & feedback: links to Learn and the guides, and a switch to stop offering guides. */
function learnLinks() {
  return `<div class="btns" style="margin-top:10px" translate="no"><button type="button" class="btn" data-action="learn">${L2('Learn: short lessons and guides', 'Apprendre : courtes leçons et guides')}</button></div>
    <label class="check small" style="margin-top:8px" translate="no"><input type="checkbox" id="guides-off" ${S().guidesOff ? 'checked' : ''}><span>${L2('Don\'t offer guides when I open a screen', 'Ne pas proposer de guide à l\'ouverture d\'un écran')}</span></label>`;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-action]'); if (!b || e.target.closest('.sheet')) return;
  const a = b.dataset.action;
  if (a === 'guide-open') guideSheet(b.dataset.g);
  else if (a === 'guide-dismiss') { markGuideSeen(b.dataset.g); const c = $('#guide-offer'); if (c) c.remove(); toast('OK. Guides are in Settings → Help & feedback → Learn.'); }
  else if (a === 'learn') learnSheet();
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'guides-off' && Store.mode !== 'demo') { Store.state.settings.guidesOff = e.target.checked; Store.touch('settings'); }
});
if (typeof module !== 'undefined') module.exports = { GUIDES, LESSONS, GUIDE_ORDER, LESSON_ORDER };

/* ---- demo.js ---- */
/* ================= Public web demo: view-only =================
   The demo (dist/demo.html, the website's demo.html) shows the example person's data on every screen,
   including the MapleBook Plus screens, but nothing that changes the calculations can be used:
   - every input, select and textarea is disabled, except navigation (tax year, language, transaction filters);
   - buttons that add, edit, import, delete or save are disabled; navigation buttons and tabs stay usable;
   - as a second layer, settings and transactions can't be changed while the lock is on, even from code.
   Each screen and sheet shows DEMO_NOTE. */
const DEMO_NOTE = 'This is a demo with made-up numbers. Get MapleBook on Google Play to use your own.';
const DemoLock = {
  on: false,
  // inputs that only change what is shown, not what is calculated
  ALLOW_IDS: ['tax-year', 'f-month', 'f-type', 'f-cat', 'f-q', 's-devSimulateFree'],
  ALLOW_SETTINGS: ['devSimulateFree'],
  NAV_SEGS: ['ovmode', 'planmode', 'taxmode', 'txview'],
  NAV_ACTIONS: ['month', 'goto-month', 'goto-year', 'cal-month', 'ov-year', 'tax-year', 'more-tx', 'clear-filters', 'upgrade', 'partner-settings', 'confirm-cancel'],
  // button attributes that edit something
  EDIT_ATTRS: ['data-bk', 'data-buy', 'data-cat', 'data-date', 'data-ess', 'data-preset', 'data-i', 'data-k', 'data-keep', 'data-sync', 'data-wl', 'data-confirmed'],
  active() { return this.on && Store.mode === 'demo'; },
  allowedField(el) { return !!(el.closest('.lang-pick') || this.ALLOW_IDS.includes(el.id)); },
  allowedButton(b) {
    if (b.matches('[data-close], .close, .nav-btn, [data-nav], [data-legal], [data-day]')) return true;
    if (b.type === 'submit' || b.classList.contains('calc-btn')) return false;
    if (b.dataset.action) return this.NAV_ACTIONS.includes(b.dataset.action);
    if (b.dataset.seg) return this.NAV_SEGS.includes(b.dataset.seg);
    return !this.EDIT_ATTRS.some((a) => b.hasAttribute(a));
  },
  note() { return `<div class="callout plain demo-note" role="note"><span>${DEMO_NOTE}</span></div>`; },
  apply(root) {
    if (!this.active() || !root || !root.querySelectorAll) return;
    for (const el of root.querySelectorAll('input, select, textarea')) {
      if (this.allowedField(el) || el.disabled) continue;
      el.disabled = true; el.classList.add('demo-locked'); el.setAttribute('aria-disabled', 'true');
    }
    for (const b of root.querySelectorAll('button')) {
      if (b.disabled || this.allowedButton(b)) continue;
      b.disabled = true; b.classList.add('demo-locked');
    }
    const hosts = [document.getElementById('view'), ...document.querySelectorAll('.sheet')];
    for (const h of hosts) {
      if (!h || h.querySelector(':scope > .demo-note, :scope > * > .demo-note')) continue;
      if (h.id === 'view' && !h.firstElementChild) continue;
      const head = h.classList.contains('sheet') ? h.querySelector('.sheet-head') : null;
      if (head) head.insertAdjacentHTML('afterend', this.note()); else h.insertAdjacentHTML('afterbegin', this.note());
    }
  },
  start() {
    if (Store.mode !== 'demo' || this.on) return;
    if ((window.LEDGER_CONFIG || {}).testOnlyEditableDemo === true) return;   // older automated tests that edit demo data
    this.on = true;
    // example planner and scenario inputs, so the Plus screens show results
    Object.assign(ui.exp, { name: 'New laptop', amount: '1800', freq: 'once', biz: true, bizPct: 60 });
    Object.assign(ui.buy, { name: 'E-bike', price: '2400', addHst: true, date: `${YEAR + 1}-05-01`, saved: '600' });
    // second layer: data and settings can't change while the demo is locked
    const block = (name) => (...a) => { console.info('MapleBook demo: view only, ' + name + ' ignored'); return a[0]; };
    const realSet = setSetting;
    setSetting = (k, v) => (this.ALLOW_SETTINGS.includes(k) ? realSet(k, v) : block('setSetting')(k, v));
    addTx = block('addTx'); addMany = block('addMany'); removeTx = block('removeTx');
    // a click on anything locked (for example if the disabled flag was removed) does nothing but show the note
    document.addEventListener('click', (e) => {
      const t = e.target.closest && e.target.closest('.demo-locked'); if (!t || !this.active()) return;
      e.preventDefault(); e.stopImmediatePropagation(); toast(DEMO_NOTE);
    }, true);
    for (const type of ['input', 'change', 'submit']) document.addEventListener(type, (e) => {
      if (!this.active()) return;
      const t = e.target;
      if (type === 'submit' || (t.matches && t.matches('input, select, textarea') && !this.allowedField(t))) { e.preventDefault(); e.stopImmediatePropagation(); }
    }, true);
    new MutationObserver((ms) => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) this.apply(n.closest('.sheet') || n.parentElement || n); }).observe(document.body, { childList: true, subtree: true });
    this.apply(document.body);
  }
};
</script>
